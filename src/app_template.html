<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Песни прославления</title>
<style>
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --surface-2: #faf9f6; --ink: #1d1f23; --muted: #6c7079;
    --line: #e5e2da; --accent: #3a5f8f; --accent-soft: #e8eef6; --chord: #b8402f; --mark: #ffe9a8;
    --sec: #3a5f8f; --tr: #5d6b7c; --danger: #b3261e; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --st-songbook: #2e7d4f; --st-songbook-bg: #e3f3e9; --st-learning: #a8650a; --st-learning-bg: #fdf0dc; --st-proposed: #5b5f97; --st-proposed-bg: #ebebf7;
  }
  :root[data-theme="dark"] {
    --bg: #141518; --surface: #1d1f23; --surface-2: #23262b; --ink: #ecebe7; --muted: #9a9ea6;
    --line: #2f3238; --accent: #8db4e8; --accent-soft: #263445; --chord: #f0907d; --mark: #6b5a1e;
    --sec: #8db4e8; --tr: #a9b6c6; --danger: #f2b8b5; --shadow: none;
    --st-songbook: #8fd3a8; --st-songbook-bg: #1f3a2a; --st-learning: #f2c27b; --st-learning-bg: #3d2f17; --st-proposed: #b9bcf0; --st-proposed-bg: #2b2c45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button, select { cursor: pointer; }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

  /* ---------- общие элементы ---------- */
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 11px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.on, .btn.on:hover, .btn.primary, .btn.primary:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg, .icon-btn svg, .mi svg { width: 16px; height: 16px; flex-shrink: 0; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: inline-grid; place-items: center; flex-shrink: 0; }
  .icon-btn.sm { width: 32px; height: 32px; border-radius: 8px; }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .group { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; flex-shrink: 0; }
  .group button { border: 0; background: transparent; padding: 6px 11px; min-height: 34px; font-size: 15px; }
  .group button:hover { background: var(--surface-2); }
  .group .val { padding: 0 4px; font-weight: 700; font-size: 14px; min-width: 40px; text-align: center; color: var(--chord); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; text-decoration: none; }
  .pill.grey { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .pill.tag { background: #efe9f7; color: #6a4a94; }
  :root[data-theme="dark"] .pill.tag { background: #352b44; color: #c9b2ea; }
  .pill.st-songbook { background: var(--st-songbook-bg); color: var(--st-songbook); }
  .pill.st-learning { background: var(--st-learning-bg); color: var(--st-learning); }
  .pill.st-proposed { background: var(--st-proposed-bg); color: var(--st-proposed); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
  .seg-ctl button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px; }
  .seg-ctl button + button { border-inline-start: 1px solid var(--line); }
  .seg-ctl button.on { background: var(--ink); color: var(--bg); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }

  /* меню */
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.14); min-width: 250px; padding: 6px; z-index: 20; display: none; }
  .menu.open { display: block; }
  .mi { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: transparent; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-align: start; text-decoration: none; }
  .mi:hover { background: var(--surface-2); }
  .mi small { color: var(--muted); margin-inline-start: auto; font-size: 12px; }
  .mi.danger { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
  .menu .row-fs { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 14px; }
  .menu .row-fs .group, .menu .row-fs select { margin-inline-start: auto; }
  .menu .note { padding: 6px 10px; font-size: 12px; color: var(--muted); }

  /* модальное окно */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 12px 12px; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 480px; max-height: 84vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); padding: 18px; }
  .modal h3 { margin: 0 0 12px; font-size: 18px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .modal .pick { display: grid; gap: 6px; margin-top: 8px; }
  .modal .pick button { text-align: start; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; display: flex; gap: 8px; align-items: baseline; }
  .modal .pick button:hover { border-color: var(--accent); }
  .modal .pick button .muted { font-size: 13px; margin-inline-start: auto; }

  /* ---------- шапка ---------- */
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid transparent; }
  header.top.scrolled { border-bottom-color: var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .nav { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-inline-end: auto; }
  .nav button { white-space: nowrap; border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .nav button.on { background: var(--ink); color: var(--bg); }
  .nav-n { font-size: 11px; background: #d9534f; color: #fff; border-radius: 99px; padding: 0 6px; margin-inline-start: 3px; vertical-align: 1px; }
  .todo-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; }
  .todo-item .t { font-weight: 600; cursor: pointer; }
  .todo-item .probs { display: flex; flex-wrap: wrap; gap: 5px; }
  .prob { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #fdecea; color: #a1342b; }
  .prob.soft { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  :root[data-theme="dark"] .prob { background: #4a2523; color: #f2b8b5; }
  .todo-item .rv { font-size: 13px; color: var(--muted); }
  .todo-item .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .todo-item .acts .btn { min-height: 30px; padding: 3px 9px; font-size: 13px; }
  .admin-link { text-align: center; margin: 0 0 30px; }
  .gate { min-height: 80vh; display: grid; place-items: center; }
  .gate-box { max-width: 440px; text-align: center; padding: 32px 20px; }
  .gate-ico { font-size: 44px; margin-bottom: 8px; }
  .gate-box h2 { margin: 0 0 12px; }
  .team-row, .hist-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .team-row > span:first-child, .hist-row > div:first-child { flex: 1; min-width: 160px; }
  .team-inv { display: grid; gap: 6px; padding: 8px 0 12px; font-size: 14px; }
  .team-inv input { width: 100%; font-size: 13px; }
  .admin-link button { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; }
  .stage-tabs { display: flex; gap: 6px; margin: 2px 0 10px; overflow-x: auto; scrollbar-width: none; }
  .stage-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 14px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .stage-tabs button .n { font-size: 12px; color: var(--muted); }
  .stage-tabs button.on { border-color: transparent; font-weight: 600; }
  .stage-tabs button.on[data-st="all"] { background: var(--ink); color: var(--bg); }
  .stage-tabs button.on[data-st="all"] .n { color: inherit; opacity: .7; }
  .stage-tabs button.on[data-st="songbook"] { background: var(--st-songbook-bg); color: var(--st-songbook); }
  .stage-tabs button.on[data-st="learning"] { background: var(--st-learning-bg); color: var(--st-learning); }
  .stage-tabs button.on[data-st="proposed"] { background: var(--st-proposed-bg); color: var(--st-proposed); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.songbook { background: var(--st-songbook); } .dot.learning { background: var(--st-learning); } .dot.proposed { background: var(--st-proposed); }
  .search { position: relative; }
  .search input { width: 100%; font-size: 17px; padding: 12px 40px 12px 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); outline: none; box-shadow: var(--shadow); unicode-bidi: plaintext; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search input:focus { border-color: var(--accent); }
  .search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; pointer-events: none; }
  .search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; display: none; font-size: 20px; line-height: 1; }
  .search.has-q .clear { display: block; }
  .filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 14px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.tagchip.on { background: #6a4a94; border-color: #6a4a94; color: #fff; }
  select.chip { padding-inline-end: 8px; appearance: auto; width: auto; max-width: 210px; }

  /* ---------- список песен ---------- */
  .list { list-style: none; margin: 8px 0 20px; padding: 0; display: grid; gap: 8px; }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); display: block; text-decoration: none; cursor: pointer; }
  .item:hover { border-color: var(--accent); }
  .item .row { display: flex; align-items: baseline; gap: 8px; }
  .item .tt { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; min-width: 0; }
  .item .t { font-weight: 600; font-size: 17px; }
  .item .alt { color: var(--muted); font-size: 14px; }
  .item .meta { margin-inline-start: auto; display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .item .snip { color: var(--muted); font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .local-note { margin: 0 0 40px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ---------- песня ---------- */
  .song-top { position: sticky; top: 0; z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); }
  .song-bar { display: flex; align-items: center; gap: 6px; padding: 10px 0; }
  .ctx-bar { display: flex; align-items: center; gap: 8px; padding: 0 0 10px; font-size: 14px; }
  .ctx-bar .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-head { padding: 18px 0 4px; }
  .song-head h2 { margin: 0; font-size: 26px; letter-spacing: -.01em; line-height: 1.25; }
  .song-head .alt { color: var(--muted); margin-top: 2px; }
  .song-head .meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .song-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .chart { margin: 14px 0 4px; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .chart .h { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .chart .cl { white-space: pre-wrap; font-weight: 700; color: var(--chord); direction: ltr; unicode-bidi: isolate; text-align: left; }
  .chart .cl .lab { color: var(--sec); font-weight: 600; }
  .related { border-top: 1px solid var(--line); padding: 16px 0 50px; }
  .related h3 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .related .links { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .related .links a { font-size: 14px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; }
  .related .links a:hover { border-color: var(--accent); }
  .related .none { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .howto { margin: 12px 0 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .howto summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; list-style: none; }
  .howto summary::-webkit-details-marker { display: none; }
  .howto summary::after { content: "▾"; float: right; color: var(--muted); }
  .howto[open] summary::after { content: "▴"; }
  #howtoBody { padding: 0 14px 12px; display: grid; gap: 12px; }
  .howto-sec h4 { margin: 4px 0 6px; font-size: 14px; }
  .howto-sec ul { margin: 0 0 6px; padding-inline-start: 18px; font-size: 14px; }
  .cap-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; padding: 6px 8px; border-radius: 8px; }
  .cap-row.cur { background: var(--accent-soft); }
  .cap-row .btn { min-height: 30px; padding: 3px 9px; font-size: 13px; }
  .ai-prompt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .ai-prompt code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; direction: ltr; }
  .ai-prompt .btn { min-height: 30px; padding: 3px 9px; font-size: 13px; }
  .notes-ta { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface-2); font-size: 14px; margin-bottom: 6px; }
  .capo-bar { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .capo-bar .btn { margin-inline-start: auto; min-height: 30px; padding: 3px 9px; font-size: 13px; }
  .player { margin: 12px 0 4px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #000; }
  .player iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
  .player-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--surface); font-size: 14px; }
  select.st-sel { border: 0; border-radius: 99px; font-size: 12px; padding: 2px 6px; appearance: auto; }

  /* текст песни */
  .lyrics { padding: 10px 0 30px; font-size: var(--fs, 19px); }
  .lyrics .ln { min-height: 1.5em; line-height: 1.5; }
  .lyrics .ln.has-ch { line-height: 2.5; margin-top: .3em; }
  .lyrics .ln.blank { height: .9em; min-height: 0; }
  .lyrics .ln.tr { color: var(--tr); font-size: .78em; line-height: 1.35; min-height: 0; margin-bottom: .35em; font-style: italic; }
  .lyrics .sec { font-weight: 700; color: var(--sec); font-size: .7em; text-transform: uppercase; letter-spacing: .06em; margin-top: .7em; line-height: 1.6; }
  .seg { position: relative; }
  .seg.pad { display: inline-block; line-height: 1.25; }
  .ch { position: absolute; bottom: 100%; margin-bottom: .1em; left: 0; font-weight: 700; color: var(--chord); font-size: .82em; line-height: 1; white-space: nowrap; unicode-bidi: isolate; direction: ltr; font-style: normal; }
  [dir=rtl] .ch { left: auto; right: 0; }
  .ln.only-ch { line-height: 1.9; }
  .ln.only-ch .chrow { display: inline-flex; gap: .9em; color: var(--chord); font-weight: 700; font-size: .85em; direction: ltr; }
  .no-chords .ch, .no-chords .ln.only-ch, .no-chords .chart { display: none; }
  .no-chords .ln.has-ch { line-height: 1.5; margin-top: 0; }
  .no-chords .seg.pad { min-width: 0 !important; display: inline; }

  /* ---------- редактор ---------- */
  .editor { padding: 16px 0 60px; display: grid; gap: 14px; }
  .field label, .field .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field input[type=text], .field input[type=url], .field input[type=date], .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; font-size: 16px; outline: none; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { font: 15px/1.6 ui-monospace, "SF Mono", Consolas, monospace; min-height: 280px; resize: vertical; }
  .field textarea.short { min-height: 90px; }
  .field .help { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .field .help code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; font-size: 12.5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tag-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag-pick input { width: 160px !important; padding: 5px 10px !important; border-radius: 99px !important; font-size: 14px !important; }
  .link-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 6px; margin-bottom: 6px; }
  .preview { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 16px; }
  .ed-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .save-bar { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- сет-листы ---------- */
  .sets { display: grid; gap: 8px; margin: 8px 0 40px; }
  .set-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; box-shadow: var(--shadow); }
  .set-card:hover { border-color: var(--accent); }
  .set-card .nm { font-weight: 600; }
  .set-card .sub { color: var(--muted); font-size: 14px; }
  .set-head { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 16px 0 6px; align-items: end; }
  .set-head input { border: 1px solid transparent; background: transparent; font-size: 24px; font-weight: 700; padding: 4px 6px; margin-inline-start: -7px; border-radius: 8px; width: 100%; outline: none; }
  .set-head input:hover, .set-head input:focus { border-color: var(--line); background: var(--surface); }
  .set-head input[type=date] { font-size: 15px; font-weight: 400; width: auto; border-color: var(--line); background: var(--surface); }
  .set-items { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
  .set-item { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .set-item .num { width: 22px; text-align: center; color: var(--muted); font-weight: 600; flex-shrink: 0; }
  .set-item .ti { flex: 1; min-width: 0; cursor: pointer; }
  .set-item .ti .t { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-item .ti .s { font-size: 13px; color: var(--muted); }
  .set-item .group .val { min-width: 34px; }
  .set-item .group button { padding: 4px 8px; min-height: 30px; }
  .set-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 40px; }

  /* ---------- во весь экран ---------- */
  .stage { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .stage .lyrics { padding: 64px 20px 80px; max-width: 1100px; margin: 0 auto; }
  .stage .stage-title { font-weight: 700; font-size: calc(var(--fs) * .8); color: var(--muted); margin-bottom: .6em; }

<body>
<div id="app"></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= данные ======================= */
const BASE_SONGS = /*SONGS_JSON*/[];
const CLOUD = /*CLOUD_CONFIG*/null; // {url, key} — общая база Supabase; null — всё хранится в браузере

/* ======================= хранилище в браузере =======================
   Пока нет общей базы, всё, что вы меняете (новые песни, правки, этапы, теги,
   сет-листы), хранится в этом браузере. Резервная копия — «Скачать все → .json». */
const store = {
  get(k, d) { try { const v = localStorage.getItem("songs:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("songs:" + k, JSON.stringify(v)); return true; } catch { return false; } },
};
let STORAGE_OK = false;
try { localStorage.setItem("songs:__t", "1"); localStorage.removeItem("songs:__t"); STORAGE_OK = true; } catch {}

const STATUSES = [
  ["songbook", "Песенник", "Поём на собраниях"],
  ["learning", "Разучиваем", "Готовим с командой"],
  ["proposed", "На рассмотрении", "Предложены"],
];
const ST_LABEL = Object.fromEntries(STATUSES.map(s => [s[0], s[1]]));
const DEFAULT_TAGS = ["Прославление", "Поклонение", "Переходная", "Начало служения", "Причастие", "Праздник"];

const state = {
  q: "", lang: "all", key: "", tag: "",
  status: store.get("status", "songbook"),
  showChords: store.get("chords", true),
  fontSize: store.get("fs", 19),
  stageFs: store.get("stageFs", 26),
  trMode: store.get("trMode", "both"),
  projTr: store.get("projTr", false),
  printCompact: store.get("printCompact", false),
  howtoOpen: false,
  admin: store.get("admin", false),
  todoFilter: "all",
  theme: store.get("theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
  shift: {},
  capo: {},
  listScroll: 0,
  ctx: null,          // {setId, idx} — песня открыта из сет-листа
};
document.documentElement.dataset.theme = state.theme;
let IN_FRAME = false;
try { IN_FRAME = window.self !== window.top; } catch { IN_FRAME = true; }

/* ======================= текст ======================= */
const HEB_RE = /[֐-׿]/g, LTR_RE = /[A-Za-zЀ-ӿ]/g;
const SECTION_RE = /^(?:\d+[\s.]*)?(куплет|припев|пред-?припев|бридж|мост|вступление|проигрыш|концовка|кода|окончание|запев|тэг|intro|verse|chorus|pre-?chorus|bridge|outro|interlude|instrumental|tag|ending|בית|פזמון|גשר|פתיחה|סיום|מעבר|קודה)[^:]*:$/i;
const CHORD_TAG = /\[[^\]]*\]/g;
const FINALS = { "ך": "כ", "ם": "מ", "ן": "נ", "ף": "פ", "ץ": "צ" };
function normChar(c) {
  let n = c.normalize("NFD").replace(/[̀-֑ͯ-ׇ]/g, "").toLowerCase();
  if (n === "ё") n = "е";
  if (FINALS[n]) n = FINALS[n];
  if (n && !/[\p{L}\p{N}]/u.test(n)) n = " ";
  return n;
}
function norm(s) { let o = ""; for (const c of s || "") o += normChar(c); return o.replace(/\s+/g, " ").trim(); }
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function lineDir(text) {
  const t = (text || "").replace(CHORD_TAG, "");
  return (t.match(HEB_RE) || []).length > (t.match(LTR_RE) || []).length ? "rtl" : "ltr";
}
function detectLang(text) {
  const t = (text || "").replace(CHORD_TAG, "");
  return (t.match(HEB_RE) || []).length > (t.match(/[Ѐ-ӿ]/g) || []).length ? "he" : "ru";
}

/* ======================= тональности и аккорды ======================= */
const SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLAT = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
const IDX = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11, H: 11, Cb: 11, "E#": 5, "B#": 0, Fb: 4 };
const FLAT_KEYS = new Set(["F", "Bb", "Eb", "Ab", "Db", "Gb", "Dm", "Gm", "Cm", "Fm", "Bbm", "Ebm"]);
const CHORD_RE = /^[A-H][#b]?(?:maj|min|dim|aug|sus|add|m|M|°|ø|\+)?\d{0,2}(?:(?:sus|add|maj|b|#|\+|-)\d{1,2})*(?:\([^)\s]{1,8}\))?(?:\/\d{1,2})?(?:\/[A-H][#b]?)?$/;
const CHORD_EXTRA = new Set(["|", "||", "/", "-", "x2", "x3", "x4", "(x2)", "(x3)", "N.C.", "NC", "%"]);
const isChord = t => { t = t.replace("♭", "b").replace("♯", "#"); if (t.length > 2 && t[0] === "(" && t.endsWith(")")) t = t.slice(1, -1); return CHORD_RE.test(t); };
const isChordLine = line => { const t = line.trim().split(/\s+/).filter(Boolean); return t.length > 0 && t.some(isChord) && t.every(x => isChord(x) || CHORD_EXTRA.has(x)); };

function usesH(song) { return /(^|[\[\/\s])H/.test(song.lyrics + " " + (song.chord_chart || "")); }
function noteName(i, useFlat, useH) { const n = (useFlat ? FLAT : SHARP)[((i % 12) + 12) % 12]; return useH && n === "B" ? "H" : n; }
function parseKey(k) { const m = /^([A-H][#b]?)(m?)$/.exec((k || "").trim()); return m && m[1] in IDX ? { i: IDX[m[1]], minor: m[2] === "m", root: m[1] } : null; }
function keyInfo(song, shift) {
  const p = parseKey(song.key), useH = usesH(song);
  if (!p) return { name: "", useFlat: shift < 0, useH, i: null, minor: false };
  const i = (((p.i + shift) % 12) + 12) % 12;
  const useFlat = FLAT_KEYS.has(noteName(i, true, false) + (p.minor ? "m" : "")) || (!shift && p.root.endsWith("b"));
  return { name: noteName(i, useFlat, useH) + (p.minor ? "m" : ""), useFlat, useH, i, minor: p.minor };
}
function trChord(ch, shift, ki) {
  if (!shift) return ch;
  const tr = n => (n in IDX ? noteName(IDX[n] + shift, ki.useFlat, ki.useH) : n);
  return ch.replace(/^([A-H][#b]?)/, n => tr(n)).replace(/\/([A-H][#b]?)/, (_, n) => "/" + tr(n));
}
const keyCode = (i, minor) => i + (minor ? "m" : "");
function keyLabel(code) {
  const m = /^(\d+)(m?)$/.exec(code); const i = +m[1], minor = !!m[2];
  let n = (FLAT_KEYS.has(FLAT[i] + (minor ? "m" : "")) ? FLAT : SHARP)[i]; if (n === "B") n = "B/H";
  return n + (minor ? "m" : "");
}
function keyNameShift(song, shift) { return keyInfo(song, shift).name; }

// определение тональности по аккордам (как при разборе PDF)
function guessKey(text) {
  const parsed = [];
  for (const m of (text || "").matchAll(/\[([A-H][#b]?)(m(?!aj))?[^\]]*\]|(?:^|\s)([A-H][#b]?)(m(?!aj))?(?=[\d\s/(susadijM+]|$)/g)) {
    const root = m[1] || m[3], minor = !!(m[2] || m[4]);
    if (root in IDX) parsed.push([IDX[root], minor]);
  }
  if (!parsed.length) return "";
  const eq = (a, b) => a[0] === b[0] && a[1] === b[1];
  let best = null;
  for (let k = 0; k < 12; k++) {
    const dia = [[k, false], [(k + 2) % 12, true], [(k + 4) % 12, true], [(k + 5) % 12, false], [(k + 7) % 12, false], [(k + 9) % 12, true]];
    const inside = parsed.filter(p => dia.some(d => eq(d, p))).length;
    let score = inside * 2 - (parsed.length - inside) * 2 + parsed.filter(p => eq(p, [k, false])).length;
    score += 2 * eq(parsed[parsed.length - 1], [k, false]) + eq(parsed[0], [k, false]);
    if (!best || score > best[0]) best = [score, k];
  }
  const k = best[1], rel = (k + 9) % 12;
  const minor = eq(parsed[0], [rel, true]) || parsed.some(p => eq(p, [(k + 4) % 12, false]));
  let name = FLAT[minor ? rel : k];
  if (name === "B" && /(^|[\[\/\s])H/.test(text)) name = "H";
  if (minor && (name === "Db" || name === "Gb")) name = { Db: "C#", Gb: "F#" }[name];
  return name + (minor ? "m" : "");
}

// «аккорды над строками» -> «[Am] в строке»
function convertChordsAbove(text) {
  const lines = text.replace(/\t/g, "    ").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const cl = lines[i], next = lines[i + 1];
    if (isChordLine(cl) && next !== undefined && next.trim() && !isChordLine(next) && !SECTION_RE.test(next.trim())) {
      const toks = [...cl.matchAll(/\S+/g)].map(m => ({ t: m[0], col: m.index }));
      const rtl = lineDir(next) === "rtl";
      let lyric = rtl ? next.replace(/\s+$/, "") : next;
      const ins = [];
      for (const { t, col } of toks) {
        let pos;
        if (!rtl) pos = col;
        else {
          // иврит: считаем позицию от правого края строки, привязываем к началу слова
          const fromRight = cl.replace(/\s+$/, "").length - col - t.length;
          pos = Math.max(0, lyric.length - fromRight - 1);
          const before = lyric.slice(0, pos + 1);
          const ws = before.lastIndexOf(" ");
          pos = ws + 1;
        }
        ins.push([pos, t]);
      }
      if (!rtl) {
        // небольшие сдвиги к началу слова: 1-2 буква -> начало слова, последняя буква или пробел -> следующее слово
        const spans = [...lyric.matchAll(/\S+/g)].map(m => [m.index, m.index + m[0].length]);
        for (const it of ins) {
          const p = it[0];
          for (let k = 0; k < spans.length; k++) {
            const [a, b] = spans[k];
            if (p < a) { it[0] = a; break; }
            if (p < b) {
              if (p - a <= 1 && b - a >= 2) it[0] = a;
              else if (p === b - 1 && b - a >= 3 && spans[k + 1]) it[0] = spans[k + 1][0];
              break;
            }
          }
        }
      }
      ins.sort((a, b) => b[0] - a[0] || 0);
      // одинаковые позиции: сохраняем порядок чтения
      const grouped = new Map();
      for (const [p, t] of ins.slice().reverse()) grouped.set(p, (grouped.get(p) || []).concat(t));
      const positions = [...grouped.keys()].sort((a, b) => b - a);
      for (const p of positions) {
        const tok = grouped.get(p).map(t => `[${t}]`).join(rtl ? "" : "");
        if (p > lyric.length) lyric = lyric.padEnd(p);
        lyric = lyric.slice(0, p) + tok + lyric.slice(p);
      }
      out.push(lyric.replace(/\s+$/, ""));
      i++;
    } else if (isChordLine(cl)) {
      out.push(cl.trim().split(/\s+/).map(t => (isChord(t) ? `[${t}]` : t)).join(" "));
    } else out.push(cl);
  }
  return out.join("\n");
}

/* ======================= транскрипция ======================= */
function translitWithChords(he, tr) {
  const words = []; let pending = [];
  for (const tok of he.trim().split(/\s+/)) {
    const pre = [], post = []; let text = "", seen = false;
    for (const part of tok.split(/(\[[^\]]+\])/)) {
      if (!part) continue;
      if (part.startsWith("[")) (seen ? post : pre).push(part); else { text += part; seen = true; }
    }
    if (!text) { pending.push(...pre, ...post); continue; }
    words.push({ pre: [...pending, ...pre], post }); pending = [];
  }
  if (pending.length && words.length) words[words.length - 1].post.push(...pending);
  const trw = tr.trim().split(/\s+/);
  if (trw.length !== words.length) return tr;
  return trw.map((w, i) => words[i].pre.join("") + w + words[i].post.join("")).join(" ");
}
// строки текста, к которым относится транскрипция (без пустых и заголовков)
function lyricLineIdx(lyrics) {
  return lyrics.split("\n").map((l, i) => [l.replace(CHORD_TAG, "").trim(), i]).filter(([t]) => t && !SECTION_RE.test(t)).map(([, i]) => i);
}

/* ======================= песни: база + изменения в браузере ======================= */
let SONGS = [], ALL_TAGS = [], ALL_KEYS = [];
function prepSong(s) {
  s.tags = s.tags || []; s.links = s.links || []; s.translit = s.translit || [];
  s.status = s.status || "songbook";
  s.capo = s.capo | 0; s.notes = s.notes || ""; s.original = s.original || ""; s.review = s.review || [];
  s.has_chords = /\[[A-H]/.test(s.lyrics);
  s.textLines = s.lyrics.split("\n").map(l => l.replace(CHORD_TAG, "").replace(/\s+/g, " ").trim()).filter(l => l && !SECTION_RE.test(l));
  s.nTitle = norm(s.title); s.nAlt = norm(s.title_alt || "");
  s.nLines = s.textLines.map(norm);
  s.nAll = [s.nTitle, s.nAlt, ...s.nLines, ...s.translit.filter(Boolean).map(norm), ...s.tags.map(norm)].join(" | ");
  s.dir = lineDir(s.title);
  s.play_shift = parseKey(s.key) ? (s.play_shift | 0) : 0;

function search({ ignoreStatus = false } = {}) {
  const nq = norm(state.q), toks = nq ? nq.split(" ") : [];
  const res = [];
  for (const s of SONGS) {
    if (!ignoreStatus && state.status !== "all" && s.status !== state.status) continue;
    if (state.lang !== "all" && s.lang !== state.lang) continue;
    if (state.key && s.keyCode !== state.key) continue;
    if (state.tag && !s.tags.includes(state.tag)) continue;
    const r = scoreSong(s, toks, nq);
    if (r) res.push(r);
  }
  if (toks.length) res.sort((a, b) => b.score - a.score);
  return { res, toks };
}
function scoreSong(s, toks, nq) {
  if (!toks.length) return { s, score: 0, line: -1 };
  if (!toks.every(t => s.nAll.includes(t))) return null;
  let score = 0;
  for (const t of toks) {
    if (s.nTitle.startsWith(t) || s.nTitle.includes(" " + t)) score += 15; else if (s.nTitle.includes(t)) score += 10;
    if (s.nAlt.includes(t)) score += 8;
    if (s.nLines.some(l => l.includes(t))) score += 2;
  }
  if (s.nTitle.includes(nq)) score += 30;
  let line = -1;
  if (!toks.every(t => s.nTitle.includes(t) || s.nAlt.includes(t))) {
    line = s.nLines.findIndex(l => l.includes(nq));
    if (line < 0) line = s.nLines.findIndex(l => toks.every(t => l.includes(t)));
    if (line < 0) line = s.nLines.findIndex(l => l.includes(toks[0]));
    if (line >= 0 && s.nLines[line].includes(nq)) score += 10;
  }
  return { s, score, line };
}
function highlight(orig, toks) {
  if (!toks.length) return esc(orig);
  let n = ""; const map = [];
  [...orig].forEach((c, i) => { for (const ch of normChar(c)) { n += ch; map.push(i); } });
  const chars = [...orig], marks = new Array(chars.length).fill(false);
  for (const t of toks) { let from = 0, idx; while (t && (idx = n.indexOf(t, from)) >= 0) { for (let k = idx; k < idx + t.length; k++) marks[map[k]] = true; from = idx + t.length; } }
  let html = "", open = false;
  chars.forEach((c, i) => {
    const m = marks[i] || (open && /[֑-ׇ̀-ͯ]/.test(c));
    if (m && !open) { html += "<mark>"; open = true; }
    if (!m && open) { html += "</mark>"; open = false; }
    html += esc(c);

  return html + (open ? "</mark>" : "");
}

function renderLine(line, shift, ki, extraClass = "") {
  line = line.replace(/\s+$/, "");

  const dir = lineDir(line);
  if (SECTION_RE.test(line.trim())) return `<div class="ln sec" dir="${dir}">${esc(line.trim().replace(/:$/, ""))}</div>`;
  if (!line.includes("[")) return `<div class="ln ${extraClass}" dir="${dir}">${esc(line)}</div>`;
  const parts = line.split(/(\[[^\]]+\])/);
  if (!line.replace(CHORD_TAG, "").trim()) {
    const chords = parts.filter(p => p.startsWith("[")).map(p => `<span>${esc(trChord(p.slice(1, -1), shift, ki))}</span>`).join("");
    return `<div class="ln only-ch"><span class="chrow">${chords}</span></div>`;
  }
  let html = esc(parts[0]);
  for (let i = 1; i < parts.length; i += 2) {
    const ch = trChord(parts[i].slice(1, -1), shift, ki);
    const after = parts[i + 1] || "";
    const m = /^(\S*)([\s\S]*)$/.exec(after);
    const needPad = after.length * 0.5 < ch.length * 0.6 + 0.4;
    const minW = (ch.length * 0.6 + 0.45).toFixed(2);
    html += `<span class="seg${needPad ? " pad" : ""}"${needPad ? ` style="min-width:${minW}em"` : ""}><span class="ch">${esc(ch)}</span>${m[1] ? esc(m[1]) : "&nbsp;"}</span>${esc(m[2])}`;

}

  song.lyrics.split("\n").forEach((line, i) => {

const PAGE_H = 990; // ≈ 267 мм полезной высоты A4 при 96 dpi
function fitToPage(html) {
  let m = document.getElementById("measure");
  if (!m) { m = document.createElement("div"); m.id = "measure"; document.body.appendChild(m); }
  m.innerHTML = html;
  const sec = m.firstElementChild, lyr = sec.querySelector(".lyrics");
  const tries = [];
  for (let pt = 13; pt >= 10.5; pt -= 0.5) tries.push([1, pt]);
  for (let pt = 13; pt >= 8; pt -= 0.5) tries.push([2, pt]);
  let pick = [2, 8];
  for (const [cols, pt] of tries) {
    sec.classList.toggle("cols2", cols === 2);
    lyr.style.fontSize = pt + "pt";
    if (sec.scrollHeight <= PAGE_H) { pick = [cols, pt]; break; }
  }
  m.innerHTML = "";
  return html.replace('class="p-song compact', `class="p-song compact${pick[0] === 2 ? " cols2" : ""}`)

function fillList() {
  const { res, toks } = search();
  const filtered = toks.length || state.key || state.tag || state.lang !== "all";
  const pc = document.getElementById("pdfCnt"); if (pc) pc.textContent = res.length;
  const list = document.getElementById("list");
  if (!res.length) {
    // подсказка: в других этапах есть совпадения?
    const other = state.status !== "all" && toks.length ? search({ ignoreStatus: true }).res.length : 0;
    list.innerHTML = `<li class="empty">${other ? `В этом разделе ничего, но в других этапах найдено: ${other}. <button class="btn" id="showAll">Показать все</button>` : filtered ? "Ничего не найдено" : "Здесь пока нет песен"}</li>`;
    document.getElementById("showAll")?.addEventListener("click", () => { state.status = "all"; store.set("status", "all"); renderList(); });
  } else {
    list.innerHTML = res.map(({ s, line }) => {
      const snipLine = line >= 0 ? s.textLines[line] : s.textLines[0] || "";
      const kind = s.has_chords ? "" : s.chord_chart ? '<span class="pill grey">схема</span>' : '<span class="pill grey">текст</span>';
      return `<li><a class="item" href="#${s.id}" data-go="${s.id}" dir="${s.dir}">
        <div class="row">
          <span class="tt"><span class="t">${highlight(s.title, toks)}</span>${s.title_alt ? `<span class="alt">${highlight(s.title_alt, toks)}</span>` : ""}</span>
          <span class="meta">${state.status === "all" ? `<span class="pill st-${s.status}">${ST_LABEL[s.status]}</span>` : ""}${s.key ? `<span class="pill" title="${s.play_shift ? "Наша тональность, ориг. " + esc(s.key) : "Тональность"}">${s.play_shift ? "📌 " : ""}${esc(s.playKey)}</span>` : ""}${kind}</span>
        </div>
        ${snipLine ? `<div class="snip" dir="${lineDir(snipLine)}">${line >= 0 ? highlight(snipLine, toks) : esc(snipLine)}</div>` : ""}
        ${s.tags.length ? `<div class="tags">${s.tags.map(t => `<span class="pill tag">${esc(t)}</span>`).join("")}</div>` : ""}
      </a></li>`;
    }).join("");
  }
  const n = localChangesCount();
  document.getElementById("localNote").innerHTML = !STORAGE_OK
    ? `<div class="local-note">⚠ В этом окне браузер не даёт сохранять изменения. Откройте сайт в обычном браузере.</div>`
    : n ? `<div class="local-note">Изменения (${n}) сохранены только в этом браузере, пока не подключена общая база. Сделайте резервную копию, чтобы не потерять их.
        <button class="btn" id="bk">${ICON.down}Резервная копия</button></div>` : "";
  document.getElementById("bk")?.addEventListener("click", () => download("songs-backup.json", backupJson(SONGS), "application/json"));
}

function importBackup() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    try {
      const data = JSON.parse((await inp.files[0].text()).replace(/^﻿/, ""));
      const songs = Array.isArray(data) ? data : data.songs || [];
      if (CLOUD) {
        if (!needEdit()) return;
        const cur = new Map((cloud.songs || []).map(s => [s.id, JSON.stringify(songRow(s))]));
        let n = 0;
        for (const s of songs) {
          if (!s || !s.id || !s.title) continue;
          const row = songRow({ ...s, status: s.status || "songbook", deleted_at: null });
          if (cur.get(s.id) !== JSON.stringify(row)) { queuePush({ t: "songs", op: "upsert", row }); n++; }
        }
        let m = 0;
        if (Array.isArray(data.setlists)) {
          const sets = getSets(); const ids = new Set(sets.map(s => s.id));
          data.setlists.forEach(s => { if (s && s.id && !ids.has(s.id)) { sets.push(s); m++; } });
          if (m) saveSets(sets);
        }
        loadSongs(); renderList(); toast(`Обновлено песен: ${n}${m ? `, сет-листов добавлено: ${m}` : ""}`);
        return;
      }
      const edits = store.get("edits", {});
      let n = 0;
      for (const s of songs) { if (s && s.id && s.title) { edits[s.id] = pick({ ...s, status: s.status || "songbook" }); n++; } }
      store.set("edits", edits);
      if (Array.isArray(data.setlists)) {
        const sets = getSets(); const ids = new Set(sets.map(s => s.id));
        data.setlists.forEach(s => { if (!ids.has(s.id)) sets.push(s); });
        saveSets(sets);
      }
      loadSongs(); renderList(); toast(`Загружено песен: ${n}`);
    } catch { toast("Не получилось прочитать файл"); }
  };
  inp.click();
}

/* ======================= экран: песня ======================= */
function relatedHtml(song, ki) {
  if (ki.i === null) return "";
  const code = keyCode(ki.i, ki.minor);
  const rel = ki.minor ? keyCode((ki.i + 3) % 12, false) : keyCode((ki.i + 9) % 12, true);
  const same = SONGS.filter(s => s !== song && s.keyCode === code);
  const relSongs = SONGS.filter(s => s !== song && s.keyCode === rel);
  const links = arr => arr.map(s => `<a href="#${s.id}" data-go="${s.id}" dir="${s.dir}"><span class="dot ${s.status}"></span> ${esc(s.title)}</a>`).join("");
  return `<section class="related">
    <h3>В той же тональности — ${esc(ki.name)}</h3>
    ${same.length ? `<div class="links">${links(same)}</div>` : `<div class="none">Других песен в ${esc(ki.name)} пока нет</div>`}
    ${relSongs.length ? `<h3>В параллельной тональности — ${esc(keyLabel(rel).replace("B/H", ki.useH ? "H" : "B"))}</h3><div class="links">${links(relSongs)}</div>` : ""}
  </section>`;
}
function ytId(url) {
  const m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/.exec(url || "");
  return m ? m[1] : "";
}
function listenButtons(song) {
  if (!song.links.length) return `<a class="btn" href="${listenUrl(song)}" target="_blank" rel="noopener" title="Ссылки на запись пока нет — откроется поиск">${ICON.search}Найти на YouTube</a>`;
  return song.links.map((l, i) => {
    const yt = ytId(l.url);
    const label = esc(l.label || (i === 0 ? "Слушать" : "Запись " + (i + 1)));
    // на своём сайте YouTube играет прямо на странице; в окне просмотра Claude — открываем ссылку
    return yt && !IN_FRAME
      ? `<button class="btn" data-play="${yt}">${ICON.play}${label}</button>`
      : `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${ICON.play}${label}</a>`;
  }).join("");
}
function bindListen(song) {
  document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => {
    const box = document.getElementById("player"), id = b.dataset.play;

    box.innerHTML = `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="YouTube"></iframe>

}

  const links = $("f-links");
  const linkRow = (l = { label: "", url: "" }) => {
    const d = document.createElement("div"); d.className = "link-row field";
    d.innerHTML = `<input type="text" placeholder="Название (напр. Оригинал)" value="${esc(l.label)}"><input type="url" placeholder="https://…" value="${esc(l.url)}" dir="ltr"><button type="button" class="icon-btn" title="Убрать">${ICON.close}</button>`;

  updYt(); $("f-title").addEventListener("input", updYt); $("f-alt").addEventListener("input", updYt);

    if (!title) { $("f-title").focus(); return toast("Нужно название"); }
    const lyrics = lyr.value.replace(/\r/g, "").replace(/\s+$/, "");
    const lines = lyrics.split("\n");

      idx.forEach((li, k) => translit[li] = (trl[k] || "").trim());
    }
    const out = {
      ...s, title, title_alt: $("f-alt").value.trim(), original: $("f-orig").value.trim(), key: $("f-key").value.trim(), lang: $("f-lang").value,
      lyrics, chord_chart: $("f-chart").value.replace(/\r/g, "").trim(),
      translit: translit.some(Boolean) ? translit : [],
      tags: [...$("f-tags").querySelectorAll("[data-t].on")].map(b => b.dataset.t),
      links: [...links.querySelectorAll(".link-row")].map(r => { const [a, b] = r.querySelectorAll("input"); return { label: a.value.trim(), url: b.value.trim() }; }).filter(l => /^https?:\/\//.test(l.url)),
    };

    delete state.shift[out.id];

    state.status = out.status; store.set("status", out.status);
    go(out.id);
  };
  if (isNew) $("f-title").focus();
}

const PROBLEMS = [
  ["nolyrics", "Нет текста", s => !s.lyrics.trim()],
  ["nochords", "Нет аккордов", s => s.lyrics.trim() && !s.has_chords && !s.chord_chart],
  ["chartonly", "Аккорды только схемой", s => !s.has_chords && !!s.chord_chart, true],
  ["nokey", "Нет тональности", s => (s.has_chords || s.chord_chart) && !s.key],
  ["nolink", "Нет записи (YouTube)", s => !s.links.length, true],
  ["notr", "Нет транскрипции", s => s.lang === "he" && s.lyrics.trim() && !hasTranslit(s)],
  ["nosec", "Нет разметки куплет/припев", s => s.textLines.length > 8 && !s.lyrics.split("\n").some(l => SECTION_RE.test(l.trim())), true],
  ["notags", "Нет тегов", s => !s.tags.length, true],
  ["review", "Проверить после импорта", s => s.review.length > 0],
];
const songProblems = s => PROBLEMS.filter(p => p[2](s));
function todoCount() { return SONGS.filter(s => songProblems(s).some(p => !p[3])).length; }
function renderTodo() {

        <div class="probs">${probs.map(p => `<span class="prob ${p[3] ? "soft" : ""}">${p[1]}</span>`).join("")}</div>

          ${s.review.length ? `<button class="btn" data-ok="${s.id}">✓ Проверено</button>` : ""}

      </div>`).join("") : `<div class="empty">Здесь пусто — всё доделано 🎉</div>`}
    </div></main>`;

    const text = ["Что доделать в песнях:", ...list.map(({ s, probs }) => `• ${s.title} — ${probs.filter(p => f === "all" ? !p[3] : p[0] === f).map(p => p[1].charAt(0).toLowerCase() + p[1].slice(1)).join(", ")}`)].join("\n");
    try { await navigator.clipboard.writeText(text); toast("Список скопирован"); } catch { toast("Не удалось скопировать"); }
  };
}
async function sha(t) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("songs:" + t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) | 0; return String(h); }
}
function adminDialog() {
  if (CLOUD) return teamDialog();
  if (state.admin) {
    return confirmDialog("Выйти из режима админа на этом устройстве?", "Выйти", () => { state.admin = false; store.set("admin", false); go(""); });
  }
  const hasPin = !!store.get("adminPin", "");
  modal(`<h3>Режим админа</h3>
    <div class="muted" style="font-size:14px">${hasPin ? "Введите PIN админа." : "Придумайте PIN для режима админа на этом устройстве."} Пока нет общей базы, это только «замок» от случайных глаз; настоящий вход по паролю появится вместе с Supabase.</div>
    <div class="field" style="margin-top:12px"><input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN"></div>
    <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn primary" data-ok>${hasPin ? "Войти" : "Сохранить PIN и войти"}</button></div>`, (m, close) => {
    const pin = m.querySelector("#pin"); pin.focus();
    const ok = async () => {

      const h = await sha(v);
      if (hasPin && h !== store.get("adminPin", "")) return toast("Неверный PIN");

      state.admin = true; store.set("admin", true); close(); toast("Режим админа включён"); go("todo");

    m.querySelector("[data-ok]").onclick = ok;
    pin.onkeydown = e => { if (e.key === "Enter") ok(); };

  });
}

        <div class="seg-ctl" id="cl"><button data-l="rus" class="on">Русский</button><button data-l="heb">עברית</button></div>
        <span class="spacer"></span><button class="btn" id="cAll">Вся картинка</button>
      </div>
      <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn primary" data-ok>Распознать</button></div>`, (m, close) => {
      const ci = m.querySelector("#ci"), cs = m.querySelector("#cs"), cw = m.querySelector("#cw");
      ci.src = img.src;
      let lang = "rus", sel = null, start = null;
      const W = img.naturalWidth, H = img.naturalHeight;
      const showSel = () => {
        if (!sel) { cs.style.display = "none"; return; }
        const k = ci.clientWidth / W;
        Object.assign(cs.style, { display: "block", left: sel.x * k + "px", top: sel.y * k + "px", width: sel.w * k + "px", height: sel.h * k + "px" });
      };
      const pt = e => { const r = ci.getBoundingClientRect(), k = W / r.width; return { x: Math.max(0, Math.min(W, (e.clientX - r.left) * k)), y: Math.max(0, Math.min(H, (e.clientY - r.top) * k)) }; };

      cw.addEventListener("pointerup", () => { start = null; if (sel && (sel.w < 20 || sel.h < 20)) { sel = null; showSel(); } });
      m.querySelector("#cAll").onclick = () => { sel = null; showSel(); };
      m.querySelector("#cl").onclick = e => { const b = e.target.closest("[data-l]"); if (!b) return; lang = b.dataset.l; m.querySelectorAll("#cl button").forEach(x => x.classList.toggle("on", x === b)); };
      m.querySelector("[data-x]").onclick = () => { done = true; close(); resolve(null); };
      m.querySelector("[data-ok]").onclick = () => { done = true; close(); resolve({ crop: sel, lang }); };
    });
  });
}

function quickSearch() {

  modal(`<div class="search"><span class="ico">${ICON.search}</span><input id="qsq" type="search" placeholder="Быстрый поиск песни" autocomplete="off"></div>
    <div class="qs-list" id="qsr"></div>`, (m, close) => {
    let sel = 0, res = [];

    const draw = () => {
      const nq = norm(inp.value), toks = nq ? nq.split(" ") : [];
      res = SONGS.map(s => scoreSong(s, toks, nq)).filter(Boolean);
      if (toks.length) res.sort((a, b) => b.score - a.score);
      res = res.slice(0, 30); sel = Math.min(sel, Math.max(0, res.length - 1));
      m.querySelector("#qsr").innerHTML = res.map(({ s, line }, i) => `<button data-i="${i}" class="${i === sel ? "sel" : ""}" dir="${s.dir}">
        <span class="t">${highlight(s.title, toks)} <span class="dot ${s.status}"></span> <span class="muted" style="font-weight:400;font-size:13px">${esc(s.playKey || "")}</span></span>

    };
    const open = i => { const r = res[i]; if (!r) return; close(); go(r.s.id); };
    inp.oninput = () => { sel = 0; draw(); };
    inp.onkeydown = e => {
      if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(res.length - 1, sel + 1); draw(); }
      if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
      if (e.key === "Enter") { e.preventDefault(); open(sel); }
    };
    m.querySelector("#qsr").onclick = e => { const b = e.target.closest("[data-i]"); if (b) open(+b.dataset.i); };
    draw(); inp.focus();
  });
}

let wakeLock = null, stageTimer = null;

  document.body.append(stage, bar); document.body.style.overflow = "hidden";

    const shift = curShift(song), ki = keyInfo(song, shift), capo = curCapo(song);

    stage.innerHTML = `<div class="lyrics" style="--fs:${state.stageFs}px">
      <div class="stage-title" dir="${song.dir}">${esc(song.title)}${ki.name && state.showChords ? ` · ${esc(ki.name)}` : ""}${capo && state.showChords ? ` · капо ${capo}` : ""}</div>
      ${song.chord_chart ? `<div class="chart"><div class="cl">${renderChart(song, shift - capo)}</div></div>` : ""}
      ${renderLyrics(song, shift - capo, state.trMode)}</div>`;
    bar.innerHTML = `<button class="icon-btn" data-s="close" title="Закрыть">${ICON.close}</button><span class="spacer"></span>
      ${hasChords ? `<div class="group"><button data-s="down">−</button><span class="val">${esc(ki.name || shift || "—")}</span><button data-s="up">+</button></div>
        <button class="btn ${state.showChords ? "on" : ""}" data-s="chords">Аккорды</button>` : ""}
      <div class="group"><button data-s="fs-">A−</button><button data-s="fs+">A+</button></div>`;
  };
  draw();
  const showBar = () => { bar.classList.remove("hidden"); clearTimeout(stageTimer); stageTimer = setTimeout(() => bar.classList.add("hidden"), 3500); };
  bar.onclick = e => {
    const b = e.target.closest("[data-s]"); if (!b) return;
    const s = b.dataset.s;
    if (s === "close") return closeStage(true);
    if (s === "up") setShift(song, 1, () => {});

    if (s === "fs+" || s === "fs-") { state.stageFs = Math.min(64, Math.max(14, state.stageFs + (s === "fs+" ? 3 : -3))); store.set("stageFs", state.stageFs); }
    const y = stage.scrollTop; draw(); stage.scrollTop = y; showBar();
  };
  stage.onclick = showBar; showBar();
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {}
  keepAwake(true);
}
function closeStage(rerender) {
  const st = document.getElementById("stage"); if (!st) return;
  st.remove(); document.getElementById("stageBar")?.remove(); document.body.style.overflow = "";
  clearTimeout(stageTimer);
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
  keepAwake(false);
  if (rerender) { const cur = songById(currentId); if (cur) renderSong(cur); }
}

/* ======================= проектор (слова для зала) ======================= */
function buildSlides(song, withTr) {
  const lines = song.lyrics.split("\n");
  const blocks = []; let cur = { label: "", lines: [] };
  const push = () => {
    if (cur.lines.length) blocks.push(cur);
    else if (cur.label) {
      // «Припев:» без текста — повтор уже бывшего припева
      const prev = [...blocks].reverse().find(b => norm(b.label) === norm(cur.label) && b.lines.length);
      if (prev) blocks.push({ label: cur.label, lines: prev.lines });
    }
    cur = { label: "", lines: [] };
  };
  lines.forEach((raw, i) => {
    const plain = raw.replace(CHORD_TAG, "").replace(/\s+/g, " ").trim();
    if (!plain) { if (raw.includes("[")) return; push(); return; }
    if (SECTION_RE.test(plain)) { push(); cur.label = plain.replace(/:$/, ""); return; }
    cur.lines.push({ text: plain, tr: withTr ? song.translit[i] || "" : "" });
  });
  push();
  const slides = [];
  for (const b of blocks) {
    const max = withTr && b.lines.some(l => l.tr) ? 4 : 6;
    if (b.lines.length <= max) { slides.push({ ...b, song }); continue; }
    const parts = Math.ceil(b.lines.length / max), size = Math.ceil(b.lines.length / parts);
    for (let k = 0; k < b.lines.length; k += size) slides.push({ label: b.label, lines: b.lines.slice(k, k + size), song });
  }
  return slides;
}
let proj = null;
function openProjector(list, startSong = 0) {
  closeProjector();
  const hasHe = list.some(x => hasTranslit(x.song));
  const el = document.createElement("div"); el.className = "proj"; el.id = "proj";
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  proj = { list, el, i: 0, blank: false, uiTimer: null };
  const build = () => {
    proj.slides = list.flatMap(x => buildSlides(x.song, state.projTr && hasTranslit(x.song)));
    if (!proj.slides.length) proj.slides = [{ label: "", lines: [{ text: list[0]?.song.title || "", tr: "" }], song: list[0]?.song }];
  };
  build();
  if (startSong) proj.i = Math.max(0, proj.slides.findIndex(s => s.song === list[startSong].song));
  const fit = () => {
    const box = el.querySelector(".slide"), txt = el.querySelector(".txt"); if (!box || !txt) return;
    let lo = 16, hi = 160;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1; txt.style.fontSize = mid + "px";
      if (txt.scrollHeight <= box.clientHeight * 0.92 && txt.scrollWidth <= box.clientWidth * 0.96) lo = mid; else hi = mid;
    }
    txt.style.fontSize = lo + "px";
  };
  const draw = () => {
    const s = proj.slides[proj.i];
    const firstOfSong = proj.i === 0 || proj.slides[proj.i - 1].song !== s.song;
    el.classList.toggle("blank", proj.blank);
    el.innerHTML = `
      <div class="lbl">${firstOfSong && list.length > 1 ? esc(s.song.title) + (s.label ? " · " : "") : ""}${esc(s.label || "")}</div>
      <div class="slide"><div class="txt">${s.lines.map(l => `<span class="l" dir="${lineDir(l.text)}">${esc(l.text)}</span>${l.tr ? `<span class="t2" dir="ltr">${esc(l.tr)}</span>` : ""}`).join("")}</div></div>
      <div class="count">${proj.i + 1} / ${proj.slides.length}</div>
      <div class="proj-ui">
        <button data-p="close" title="Выйти (Esc)">✕</button>
        <button data-p="prev">◀</button><span class="pos">${proj.i + 1}/${proj.slides.length}</span><button data-p="next">▶</button>
        <button data-p="blank" class="${proj.blank ? "on" : ""}" title="Чёрный экран (B)">Чёрный</button>
        ${hasHe ? `<button data-p="tr" class="${state.projTr ? "on" : ""}" title="Транскрипция под ивритом">Транскр.</button>` : ""}
        <button data-p="fs" title="Во весь экран">⛶</button>
      </div>`;
    requestAnimationFrame(fit);
  };
  const showUi = () => { el.classList.add("show-ui"); clearTimeout(proj.uiTimer); proj.uiTimer = setTimeout(() => el.classList.remove("show-ui"), 2500); };
  proj.move = d => { proj.blank = false; proj.i = Math.min(proj.slides.length - 1, Math.max(0, proj.i + d)); draw(); };
  proj.key = e => {
    e.stopImmediatePropagation();
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); proj.move(1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); proj.move(-1); }
    else if (e.key === "b" || e.key === "B" || e.key === "и" || e.key === ".") { proj.blank = !proj.blank; draw(); }
    else if (e.key === "Home") { proj.i = 0; draw(); }
    else if (e.key === "End") { proj.i = proj.slides.length - 1; draw(); }
    else if (e.key === "Escape") closeProjector();
  };
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-p]");
    if (b) {
      const p = b.dataset.p;
      if (p === "close") return closeProjector();
      if (p === "prev") proj.move(-1);
      if (p === "next") proj.move(1);
      if (p === "blank") { proj.blank = !proj.blank; draw(); }
      if (p === "tr") { state.projTr = !state.projTr; store.set("projTr", state.projTr); const song = proj.slides[proj.i].song; build(); proj.i = Math.max(0, proj.slides.findIndex(s => s.song === song)); draw(); }
      if (p === "fs") { try { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen())?.catch?.(() => toast("Полный экран недоступен в этом окне")); } catch { toast("Полный экран недоступен в этом окне"); } }
      showUi(); return;
    }
    // клик по слайду: справа — вперёд, слева — назад
    proj.move(e.clientX > innerWidth / 3 ? 1 : -1); showUi();
  });
  el.addEventListener("mousemove", showUi);
  addEventListener("keydown", proj.key, true);
  proj.resize = () => requestAnimationFrame(fit);
  addEventListener("resize", proj.resize);
  draw(); showUi();
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {}
  keepAwake(true);
}
function closeProjector() {
  if (!proj) return;
  removeEventListener("keydown", proj.key, true); removeEventListener("resize", proj.resize);
  proj.el.remove(); proj = null; document.body.style.overflow = "";
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
  keepAwake(false);
}

/* ======================= мелочи ======================= */
let openMenu = null;
function setupMenu(btnId, menuId, onAct) {
  const btn = document.getElementById(btnId), menu = document.getElementById(menuId);
  btn.onclick = e => { e.stopPropagation(); const was = menu.classList.contains("open"); closeMenus(); if (!was) { menu.classList.add("open"); openMenu = menu; } };
  menu.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b) return; closeMenus(); onAct(b.dataset.act); });
}
function closeMenus() { document.querySelectorAll(".menu.open").forEach(m => m.classList.remove("open")); openMenu = null; }
document.addEventListener("click", e => { if (openMenu && !openMenu.contains(e.target)) closeMenus(); });
function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = state.theme; store.set("theme", state.theme);
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.innerHTML = state.theme === "dark" ? ICON.sun : ICON.moon);
}
let toastTimer;
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3200); }

/* ======================= переходы между экранами =======================
   Экран меняем сами (в некоторых окнах просмотра ссылки #… не срабатывают),
   адрес обновляем, если получится — для кнопки «назад» и ссылок. */
let current = "list", currentId = "";
function show(id, { keepCtx = false } = {}) {
  closeMenus(); closeStage(false); closeProjector();
  document.querySelectorAll(".modal-bg").forEach(m => m.remove());
  if (!keepCtx) state.ctx = null;
  if (current === "list") state.listScroll = scrollY;
  currentId = id || "";
  if (CLOUD && !ME) { current = "gate"; renderGate(); return; }
  if ((id === "new" || (id && id.startsWith("edit-"))) && !canEdit()) { needEdit(); id = id === "new" ? "" : id.slice(5); currentId = id; }
  if (id === "new") { current = "edit"; renderEditor(null); }
  else if (id && id.startsWith("edit-")) { const s = songById(id.slice(5)); current = "edit"; s ? renderEditor(s) : renderList(); }
  else if (id === "sets") { current = "sets"; renderSets(); }
  else if (id === "todo") { if (state.admin) { current = "todo"; renderTodo(); } else { current = "list"; currentId = ""; renderList(); adminDialog(); return; } }
  else if (id === "admin") { current = "list"; currentId = ""; renderList(); adminDialog(); return; }
  else if (id && id.startsWith("set-")) { const st = getSet(id); if (st) { current = "set"; renderSet(st); } else { current = "sets"; renderSets(); } }
  else if (id && songById(id)) {
    if (state.ctx) { const st = ctxSet(); if (!st || st.items[state.ctx.idx]?.songId !== id) state.ctx = null; }
    current = "song"; renderSong(songById(id));
  }
  else { current = "list"; currentId = ""; renderList(); return; }
  scrollTo(0, 0);
}
function go(id, opts) {
  show(id, opts);
  try {
    if (location.hash.slice(1) !== (id || "")) {
      if (id) history.pushState(null, "", "#" + id); else history.pushState(null, "", location.pathname + location.search);
    }
  } catch {}
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]");
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button > 0) return;
  e.preventDefault();
  const id = a.dataset.go;
  // «назад» из песни, открытой в сет-листе, — в тот же сет-лист
  go(id, { keepCtx: false });
});
const fromUrl = () => { const id = location.hash.slice(1); if (id !== currentId) show(id, { keepCtx: !!state.ctx }); };
addEventListener("hashchange", fromUrl);
addEventListener("popstate", fromUrl);
addEventListener("scroll", () => { const h = document.querySelector("header.top"); if (h) h.classList.toggle("scrolled", scrollY > 4); }, { passive: true });
addEventListener("keydown", e => {
  if (proj || document.querySelector(".modal-bg")) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if (e.key === "/" && current === "list" && !typing) { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "/" && current !== "list" && current !== "edit" && !typing) { e.preventDefault(); quickSearch(); }
  if (e.key === "Escape" && !typing) { if (document.getElementById("stage")) closeStage(true); else if (current === "song") go(state.ctx ? state.ctx.setId : ""); }
  if (current === "song" && state.ctx && !typing) {
    if (e.key === "ArrowRight") document.getElementById("nextSong")?.click();
    if (e.key === "ArrowLeft") document.getElementById("prevSong")?.click();
  }
});

loadSongs();
show(location.hash.slice(1));
if (CLOUD) cloudInit();
</script>
