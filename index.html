<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Песни прославления</title>
<style>
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --surface-2: #faf9f6; --ink: #1d1f23; --muted: #6c7079;
    --on-bg: var(--ink); --on-fg: var(--bg); --primary-bg: var(--ink); --primary-fg: var(--bg); --overlay: rgba(0,0,0,.35);
    --line: #e5e2da; --accent: #3a5f8f; --accent-soft: #e8eef6; --chord: #b8402f; --mark: #ffe9a8;
    --sec: #3a5f8f; --tr: #5d6b7c; --danger: #b3261e; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --st-songbook: #2e7d4f; --st-songbook-bg: #e3f3e9; --st-learning: #a8650a; --st-learning-bg: #fdf0dc; --st-proposed: #5b5f97; --st-proposed-bg: #ebebf7;
  }
  :root { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg: #141518; --surface: #1d1f23; --surface-2: #23262b; --ink: #ecebe7; --muted: #9a9ea6;
    --on-bg: #34465e; --on-fg: #f1f4f8; --primary-bg: #8db4e8; --primary-fg: #0e1724; --overlay: rgba(0,0,0,.62);
    --line: #33363d; --accent: #8db4e8; --accent-soft: #263445; --chord: #f0907d; --mark: #6b5a1e;
    --sec: #8db4e8; --tr: #a9b6c6; --danger: #f2b8b5; --shadow: none;
    --st-songbook: #8fd3a8; --st-songbook-bg: #1f3a2a; --st-learning: #f2c27b; --st-learning-bg: #3d2f17; --st-proposed: #b9bcf0; --st-proposed-bg: #2b2c45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button, select { cursor: pointer; }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

  /* ---------- общие элементы ---------- */
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 11px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.on, .btn.on:hover { background: var(--on-bg); color: var(--on-fg); border-color: var(--on-bg); }
  .btn.primary, .btn.primary:hover { background: var(--primary-bg); color: var(--primary-fg); border-color: var(--primary-bg); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg, .icon-btn svg, .mi svg { width: 16px; height: 16px; flex-shrink: 0; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: inline-grid; place-items: center; flex-shrink: 0; }
  .icon-btn.sm { width: 32px; height: 32px; border-radius: 8px; }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .group { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; flex-shrink: 0; }
  .group button { border: 0; background: transparent; padding: 6px 11px; min-height: 34px; font-size: 15px; }
  .group button:hover { background: var(--surface-2); }
  .group .val { padding: 0 4px; font-weight: 700; font-size: 14px; min-width: 40px; text-align: center; color: var(--chord); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; text-decoration: none; }
  .pill.grey { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .pill.tag { background: #efe9f7; color: #6a4a94; }
  :root[data-theme="dark"] .pill.tag { background: #352b44; color: #c9b2ea; }
  .pill.st-songbook { background: var(--st-songbook-bg); color: var(--st-songbook); }
  .pill.st-learning { background: var(--st-learning-bg); color: var(--st-learning); }
  .pill.st-proposed { background: var(--st-proposed-bg); color: var(--st-proposed); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
  .seg-ctl button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px; }
  .seg-ctl button + button { border-inline-start: 1px solid var(--line); }
  .seg-ctl button.on { background: var(--on-bg); color: var(--on-fg); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }

  /* меню */
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.12); min-width: 250px; padding: 6px; z-index: 20; display: none; }
  .menu.open { display: block; }
  .mi { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: transparent; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-align: start; text-decoration: none; }
  .mi:hover { background: var(--surface-2); }
  .mi small { color: var(--muted); margin-inline-start: auto; font-size: 12px; }
  .mi.danger { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
  .menu .row-fs { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 14px; }
  .menu .row-fs .group, .menu .row-fs select { margin-inline-start: auto; }
  .menu .note { padding: 6px 10px; font-size: 12px; color: var(--muted); }

  /* модальное окно */
  .modal-bg { position: fixed; inset: 0; background: var(--overlay); z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 12px 12px; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 480px; max-height: 84vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); padding: 18px; }
  .modal h3 { margin: 0 0 12px; font-size: 18px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .modal .pick { display: grid; gap: 6px; margin-top: 8px; }
  .modal .pick button { text-align: start; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; display: flex; gap: 8px; align-items: baseline; }
  .modal .pick button:hover { border-color: var(--accent); }
  .modal .pick button .muted { font-size: 13px; margin-inline-start: auto; }

  /* ---------- шапка ---------- */
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid transparent; }
  header.top.scrolled { border-bottom-color: var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .nav { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-inline-end: auto; }
  .nav button { white-space: nowrap; border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .nav button.on { background: var(--on-bg); color: var(--on-fg); }
  .nav-n { font-size: 11px; background: #d9534f; color: #fff; border-radius: 99px; padding: 0 6px; margin-inline-start: 3px; vertical-align: 1px; }
  .todo-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; }
  .todo-item .t { font-weight: 600; cursor: pointer; }
  .todo-item .probs { display: flex; flex-wrap: wrap; gap: 5px; }
  .prob { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #fdecea; color: #a1342b; }
  .prob.soft { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  :root[data-theme="dark"] .prob { background: #4a2523; color: #f2b8b5; }
  .todo-item .rv { font-size: 13px; color: var(--muted); }
  .todo-item .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .todo-item .acts .btn { min-height: 30px; padding: 3px 9px; font-size: 13px; }
  .admin-link { text-align: center; margin: 0 0 30px; }
  .lyrics.cols2 .structure { column-span: all; }
  @media (min-width: 760px) {
    .lyrics.cols2 { column-count: 2; column-gap: 48px; column-rule: 1px solid var(--line); }
    .lyrics.cols2 .blk { break-inside: avoid; }
  }
  .team-top { position: relative; }
  .add-people { margin-top: 10px; font-size: 14px; }
  .add-people summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .add-people textarea { width: 100%; margin: 8px 0; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 8px 10px; font-size: 15px; }
  .view-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 16px; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .view-bar .vb-key { display: flex; align-items: center; gap: 8px; margin-inline-end: 4px; }
  .view-bar .vb-l { font-size: 13px; color: var(--muted); }
  .struct-ed .structure { margin-bottom: 8px; }
  .st-chip.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .struct-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 14px; }
  .struct-tools .btn { padding: 5px 10px; font-size: 13px; }
  .team-top .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .structure { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 0 0 14px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 12px; font-size: 13px; }
  .structure .arr { color: var(--muted); }
  .st-chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--sec); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .st-chip.rep { background: transparent; color: var(--muted); font-weight: 500; }
  .blk.flash { animation: secflash 1.2s ease; border-radius: 8px; }
  @keyframes secflash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
  .p-song .structure { border-style: solid; font-size: 11px; padding: 4px 8px; margin-bottom: 8px; }
  .p-song .st-chip { font-size: 11px; padding: 0 6px; background: none; }
  .ai-banner { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  .ai-wait { display: flex; gap: 14px; align-items: center; margin-top: 6px; }
  .ai-spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: aispin 0.9s linear infinite; flex-shrink: 0; }
  @keyframes aispin { to { transform: rotate(360deg); } }
  .ai-opts { display: grid; gap: 10px; margin-top: 14px; }
  .gate { min-height: 80vh; display: grid; place-items: center; }
  .gate-box { max-width: 440px; text-align: center; padding: 32px 20px; }
  .gate-ico { font-size: 44px; margin-bottom: 8px; }
  .gate-box h2 { margin: 0 0 12px; }
  .chk { display: flex; gap: 8px; align-items: center; font-size: 15px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .sect { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .sect > .sect-h { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .sect .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .inline-form { display: flex; gap: 8px; }
  .inline-form input { flex: 1; min-width: 0; }
  .team-row, .hist-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .team-row:last-child, .hist-row:last-child { border-bottom: 0; }
  .member-row { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .member-row:last-child { border-bottom: 0; }
  .member-row .who { min-width: 0; }
  .member-row .who .muted { display: block; font-size: 12px; }
  .mini-sel { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 8px; padding: 4px 6px; font-size: 13px; }
  .mini-btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); border-radius: 8px; width: 30px; height: 30px; display: inline-grid; place-items: center; }
  .mini-btn:hover { color: var(--danger); border-color: var(--danger); }
  .team-row > span:first-child, .hist-row > div:first-child { flex: 1; min-width: 160px; }
  .team-inv { display: grid; gap: 6px; padding: 8px 0 12px; font-size: 14px; }
  .team-inv input { width: 100%; font-size: 13px; }
  .admin-link button { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; }
  .stage-tabs { display: flex; gap: 6px; margin: 2px 0 10px; overflow-x: auto; scrollbar-width: none; }
  .stage-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 14px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .stage-tabs button .n { font-size: 12px; color: var(--muted); }
  .stage-tabs button.on { border-color: transparent; font-weight: 600; }
  .stage-tabs button.on[data-st="all"] { background: var(--on-bg); color: var(--on-fg); }
  .stage-tabs button.on[data-st="all"] .n { color: inherit; opacity: .7; }
  .stage-tabs button.on[data-st="songbook"] { background: var(--st-songbook-bg); color: var(--st-songbook); }
  .stage-tabs button.on[data-st="learning"] { background: var(--st-learning-bg); color: var(--st-learning); }
  .stage-tabs button.on[data-st="proposed"] { background: var(--st-proposed-bg); color: var(--st-proposed); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.songbook { background: var(--st-songbook); } .dot.learning { background: var(--st-learning); } .dot.proposed { background: var(--st-proposed); }
  .search { position: relative; }
  .search input { width: 100%; font-size: 17px; padding: 12px 40px 12px 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); outline: none; box-shadow: var(--shadow); unicode-bidi: plaintext; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search input:focus { border-color: var(--accent); }
  .search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; pointer-events: none; }
  .search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; display: none; font-size: 20px; line-height: 1; }
  .search.has-q .clear { display: block; }
  .filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 14px; }
  .chip.on { background: var(--on-bg); color: var(--on-fg); border-color: var(--on-bg); }
  .chip.tagchip.on { background: #6a4a94; border-color: #6a4a94; color: #fff; }
  select.chip { padding-inline-end: 8px; appearance: auto; width: auto; max-width: 210px; }

  /* ---------- список песен ---------- */
  .list { list-style: none; margin: 8px 0 20px; padding: 0; display: grid; gap: 8px; }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); display: block; text-decoration: none; cursor: pointer; }
  .item:hover { border-color: var(--accent); }
  .item .row { display: flex; align-items: baseline; gap: 8px; }
  .item .tt { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; min-width: 0; }
  .item .t { font-weight: 600; font-size: 17px; }
  .item .alt { color: var(--muted); font-size: 14px; }
  .item .meta { margin-inline-start: auto; display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .item .snip { color: var(--muted); font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .local-note { margin: 0 0 40px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ---------- песня ---------- */
  .song-top { position: sticky; top: 0; z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); }
  .song-bar { display: flex; align-items: center; gap: 6px; padding: 10px 0; }
  .ctx-bar { display: flex; align-items: center; gap: 8px; padding: 0 0 10px; font-size: 14px; }
  .ctx-bar .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-head { padding: 18px 0 4px; }
  .song-head h2 { margin: 0; font-size: 26px; letter-spacing: -.01em; line-height: 1.25; }
  .song-head .alt { color: var(--muted); margin-top: 2px; }
  .song-head .meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .song-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .chart { margin: 14px 0 4px; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .chart .h { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .chart .cl { white-space: pre-wrap; font-weight: 700; color: var(--chord); direction: ltr; unicode-bidi: isolate; text-align: left; }
  .chart .cl .lab { color: var(--sec); font-weight: 600; }
  .related { border-top: 1px solid var(--line); padding: 16px 0 50px; }
  .related h3 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .related .links { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .related .links a { font-size: 14px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; }
  .related .links a:hover { border-color: var(--accent); }
  .related .none { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .howto { margin: 12px 0 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .howto summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; list-style: none; }
  .howto summary::-webkit-details-marker { display: none; }
  .howto summary::after { content: "▾"; float: right; color: var(--muted); }
  .howto[open] summary::after { content: "▴"; }
  #howtoBody { padding: 0 14px 12px; display: grid; gap: 12px; }
  .howto-sec h4 { margin: 4px 0 6px; font-size: 14px; }
  .howto-sec ul { margin: 0 0 6px; padding-inline-start: 18px; font-size: 14px; }
  .cap-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; padding: 6px 8px; border-radius: 8px; }
  .cap-row.cur { background: var(--accent-soft); }
  .cap-row .btn { min-height: 30px; padding: 3px 9px; font-size: 13px; }
  .ai-prompt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .ai-prompt code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; direction: ltr; }
  .ai-prompt .btn { min-height: 30px; padding: 3px 9px; font-size: 13px; }
  .notes-ta { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface-2); font-size: 14px; margin-bottom: 6px; }
  .capo-bar { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .capo-bar .btn { margin-inline-start: auto; min-height: 30px; padding: 3px 9px; font-size: 13px; }
  .player { margin: 12px 0 4px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #000; }
  .player iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
  .player-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--surface); font-size: 14px; }
  select.st-sel { border: 0; border-radius: 99px; font-size: 12px; padding: 2px 6px; appearance: auto; }

  /* текст песни */
  .lyrics { padding: 10px 0 30px; font-size: var(--fs, 19px); }
  .lyrics .ln { min-height: 1.5em; line-height: 1.5; }
  .lyrics .ln.has-ch { line-height: 2.5; margin-top: .3em; }
  .lyrics .ln.blank { height: .9em; min-height: 0; }
  .lyrics .ln.tr { color: var(--tr); font-size: .78em; line-height: 1.35; min-height: 0; margin-bottom: .35em; font-style: italic; }

  }
  if (!parsed.length) return "";
  const eq = (a, b) => a[0] === b[0] && a[1] === b[1];
  let best = null;
  for (let k = 0; k < 12; k++) {
    const dia = [[k, false], [(k + 2) % 12, true], [(k + 4) % 12, true], [(k + 5) % 12, false], [(k + 7) % 12, false], [(k + 9) % 12, true]];
    const inside = parsed.filter(p => dia.some(d => eq(d, p))).length;
    let score = inside * 2 - (parsed.length - inside) * 2 + parsed.filter(p => eq(p, [k, false])).length;
    score += 2 * eq(parsed[parsed.length - 1], [k, false]) + eq(parsed[0], [k, false]);
    if (!best || score > best[0]) best = [score, k];
  }
  const k = best[1], rel = (k + 9) % 12;
  const minor = eq(parsed[0], [rel, true]) || parsed.some(p => eq(p, [(k + 4) % 12, false]));
  let name = FLAT[minor ? rel : k];
  if (name === "B" && /(^|[\[\/\s])H/.test(text)) name = "H";
  if (minor && (name === "Db" || name === "Gb")) name = { Db: "C#", Gb: "F#" }[name];
  return name + (minor ? "m" : "");
}

// «аккорды над строками» -> «[Am] в строке»
function convertChordsAbove(text) {
  const lines = text.replace(/\t/g, "    ").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const cl = lines[i], next = lines[i + 1];
    if (isChordLine(cl) && next !== undefined && next.trim() && !isChordLine(next) && !SECTION_RE.test(next.trim())) {
      const toks = [...cl.matchAll(/\S+/g)].map(m => ({ t: m[0], col: m.index }));
      const rtl = lineDir(next) === "rtl";
      let lyric = rtl ? next.replace(/\s+$/, "") : next;
      const ins = [];
      for (const { t, col } of toks) {
        let pos;
        if (!rtl) pos = col;
        else {
          // иврит: считаем позицию от правого края строки, привязываем к началу слова
          const fromRight = cl.replace(/\s+$/, "").length - col - t.length;
          pos = Math.max(0, lyric.length - fromRight - 1);
          const before = lyric.slice(0, pos + 1);
          const ws = before.lastIndexOf(" ");
          pos = ws + 1;
        }
        ins.push([pos, t]);
      }
      if (!rtl) {
        // небольшие сдвиги к началу слова: 1-2 буква -> начало слова, последняя буква или пробел -> следующее слово
        const spans = [...lyric.matchAll(/\S+/g)].map(m => [m.index, m.index + m[0].length]);
        for (const it of ins) {
          const p = it[0];
          for (let k = 0; k < spans.length; k++) {
            const [a, b] = spans[k];
            if (p < a) { it[0] = a; break; }
            if (p < b) {
              if (p - a <= 1 && b - a >= 2) it[0] = a;
              else if (p === b - 1 && b - a >= 3 && spans[k + 1]) it[0] = spans[k + 1][0];
              break;
            }
          }
        }
      }
      ins.sort((a, b) => b[0] - a[0] || 0);
      // одинаковые позиции: сохраняем порядок чтения
      const grouped = new Map();
      for (const [p, t] of ins.slice().reverse()) grouped.set(p, (grouped.get(p) || []).concat(t));
      const positions = [...grouped.keys()].sort((a, b) => b - a);
      for (const p of positions) {
        const tok = grouped.get(p).map(t => `[${t}]`).join(rtl ? "" : "");
        if (p > lyric.length) lyric = lyric.padEnd(p);
        lyric = lyric.slice(0, p) + tok + lyric.slice(p);
      }
      out.push(lyric.replace(/\s+$/, ""));
      i++;
    } else if (isChordLine(cl)) {
      out.push(cl.trim().split(/\s+/).map(t => (isChord(t) ? `[${t}]` : t)).join(" "));
    } else out.push(cl);
  }
  return out.join("\n");
}

/* ======================= транскрипция ======================= */
function translitWithChords(he, tr) {
  const words = []; let pending = [];
  for (const tok of he.trim().split(/\s+/)) {
    const pre = [], post = []; let text = "", seen = false;
    for (const part of tok.split(/(\[[^\]]+\])/)) {
      if (!part) continue;
      if (part.startsWith("[")) (seen ? post : pre).push(part); else { text += part; seen = true; }
    }
    if (!text) { pending.push(...pre, ...post); continue; }
    words.push({ pre: [...pending, ...pre], post }); pending = [];
  }
  if (pending.length && words.length) words[words.length - 1].post.push(...pending);
  const trw = tr.trim().split(/\s+/);
  if (trw.length !== words.length) return tr;
  return trw.map((w, i) => words[i].pre.join("") + w + words[i].post.join("")).join(" ");
}
// строки текста, к которым относится транскрипция (без пустых и заголовков)
function lyricLineIdx(lyrics) {
  return lyrics.split("\n").map((l, i) => [l.replace(CHORD_TAG, "").trim(), i]).filter(([t]) => t && !SECTION_RE.test(t)).map(([, i]) => i);
}

/* ======================= песни: база + изменения в браузере ======================= */
let SONGS = [], ALL_TAGS = [], ALL_KEYS = [];
function prepSong(s) {
  s.tags = s.tags || []; s.links = s.links || []; s.translit = s.translit || [];
  s.status = s.status || "songbook";
  s.capo = s.capo | 0; s.notes = s.notes || ""; s.original = s.original || ""; s.review = s.review || [];
  s.has_chords = /\[[A-H]/.test(s.lyrics);
  s.textLines = s.lyrics.split("\n").map(l => l.replace(CHORD_TAG, "").replace(/\s+/g, " ").trim()).filter(l => l && !SECTION_RE.test(l));
  s.nTitle = norm(s.title); s.nAlt = norm(s.title_alt || "");
  s.nLines = s.textLines.map(norm);
  s.nAll = [s.nTitle, s.nAlt, ...s.nLines, ...s.translit.filter(Boolean).map(norm), ...s.tags.map(norm)].join(" | ");
  s.dir = lineDir(s.title);
  s.play_shift = parseKey(s.key) ? (s.play_shift | 0) : 0;
  const p = parseKey(s.key);
  // для фильтров и «той же тональности» берём тональность, в которой играем
  s.keyCode = p ? keyCode((((p.i + s.play_shift) % 12) + 12) % 12, p.minor) : "";
  s.playKey = p ? keyInfo(s, s.play_shift).name : "";
  return s;
}
const FIELDS = ["id", "review", "title", "title_alt", "original", "key", "play_shift", "capo", "notes", "lang", "lyrics", "chord_chart", "translit", "tags", "links", "status", "updated_at"];
// «наша тональность»: на сколько полутонов команда играет выше/ниже оригинала
const curShift = s => state.shift[s.id] ?? (s.play_shift || 0);
// капо: аккорды показываем «формами» (на capo полутонов ниже звучания)
const curCapo = s => state.capo[s.id] ?? (s.capo || 0);
const normShift = n => { n = ((n % 12) + 12) % 12; return n > 6 ? n - 12 : n; };
const pick = s => Object.fromEntries(FIELDS.map(f => [f, s[f]]));
function loadSongs() {
  if (CLOUD) {
    SONGS = (cloud.songs || BASE_SONGS).filter(s => !s.deleted_at).map(s => prepSong(clone(s)));
  } else {
    const edits = store.get("edits", {}), deleted = new Set(store.get("deleted", []));
    const map = new Map(BASE_SONGS.map(s => [s.id, { ...s }]));
    for (const [id, s] of Object.entries(edits)) map.set(id, { ...s });
    SONGS = [...map.values()].filter(s => !deleted.has(s.id)).map(prepSong);
  }
  const col = { ru: new Intl.Collator("ru"), he: new Intl.Collator("he") };
  SONGS.sort((a, b) => (a.lang === b.lang ? (col[a.lang] || col.ru).compare(a.title, b.title) : a.lang === "ru" ? -1 : 1));
  ALL_TAGS = [...new Set(SONGS.flatMap(s => s.tags))].sort((a, b) => a.localeCompare(b, "ru"));
  ALL_KEYS = [...new Set(SONGS.map(s => s.keyCode).filter(Boolean))].sort((a, b) => parseInt(a) - parseInt(b) || a.length - b.length);
}
function saveSong(song) {
  if (CLOUD) {
    if (!canEdit()) { loadSongs(); needEdit(); return false; }
    queuePush({ t: "songs", op: "upsert", row: songRow({ ...song, deleted_at: null }) });
    loadSongs(); return true;
  }
  const edits = store.get("edits", {});
  song.updated_at = new Date().toISOString();
  edits[song.id] = pick(song);
  const deleted = store.get("deleted", []).filter(x => x !== song.id);
  const ok = store.set("edits", edits) && store.set("deleted", deleted);

}
function deleteSong(id) {

    if (row) queuePush({ t: "songs", op: "upsert", row: songRow({ ...row, deleted_at: new Date().toISOString() }) });

function localChangesCount() { if (CLOUD) return 0; return Object.keys(store.get("edits", {})).length + store.get("deleted", []).length; }
const songById = id => SONGS.find(s => s.id === id);
const newId = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ======================= сет-листы ======================= */
const getSets = () => CLOUD ? clone(cloud.sets || []) : store.get("setlists", []);
function saveSets(sets) {
  if (!CLOUD) return store.set("setlists", sets);
  if (!canEdit()) { needEdit(); return false; }
  const prev = new Map((cloud.sets || []).map(s => [s.id, JSON.stringify(setRow(s))]));
  const ids = new Set();
  for (const s of sets) {
    ids.add(s.id);
    if (prev.get(s.id) !== JSON.stringify(setRow(s))) queuePush({ t: "setlists", op: "upsert", row: setRow(s) });
  }
  for (const id of prev.keys()) if (!ids.has(id)) queuePush({ t: "setlists", op: "delete", id });

}
const getSet = id => getSets().find(s => s.id === id);
function updateSet(id, fn) { const sets = getSets(); const s = sets.find(x => x.id === id); if (s) { fn(s); s.updated_at = new Date().toISOString(); saveSets(sets); } return s; }
function fmtDate(d) { if (!d) return ""; const [y, m, dd] = d.split("-"); return `${dd}.${m}.${y}`; }
function todayISO() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
/* ======================= общая база (Supabase) =======================
   Песни и сет-листы хранятся в Supabase. Копия лежит в браузере, поэтому сайт
   открывается сразу и работает при плохом интернете; изменения без связи
   ждут в очереди и отправляются, когда связь появится. */
const ROW_DEFAULTS = { title_alt: "", original: "", key: "", play_shift: 0, capo: 0, notes: "", lang: "ru", lyrics: "", chord_chart: "", translit: [], tags: [], links: [], status: "proposed", review: [] };
let db = null, ME = null;
const cloud = {
  songs: null, sets: null, queue: [], online: true, syncing: false, lastFetch: 0, ready: false, pending: 0,
};
if (CLOUD) {
  cloud.songs = store.get("cloud:songs", null);
  cloud.sets = store.get("cloud:sets", null);
  cloud.queue = store.get("cloud:queue", []);
  ME = store.get("cloud:me", null);
  state.admin = ME?.role === "admin";
}
const isMember = () => !!ME && ME.role !== "pending";
const canEdit = () => !CLOUD || isMember();
function needEdit() {
  if (canEdit()) return true;
  modal(`<h3>Только для команды</h3>
    <div class="muted" style="font-size:14px">Смотреть, искать и петь может любой. Добавлять и править песни и сет-листы — участники команды.
    Попросите у руководителя ссылку-приглашение и откройте её на этом устройстве.</div>
    <div class="actions"><button class="btn primary" data-x>Понятно</button></div>`, (m, close) => m.querySelector("[data-x]").onclick = close);
  return false;
}
const clone = o => JSON.parse(JSON.stringify(o));
function songRow(s) {
  const r = { id: s.id };
  for (const f of FIELDS) if (f !== "id" && f !== "updated_at") r[f] = s[f] ?? ROW_DEFAULTS[f] ?? "";
  r.play_shift = r.play_shift | 0; r.capo = r.capo | 0;
  if (!STATUSES.some(x => x[0] === r.status)) r.status = "proposed";
  for (const f of ["translit", "tags", "links", "review"]) if (!Array.isArray(r[f])) r[f] = [];
  r.tags = r.tags.map(String);

}
const setRow = s => ({ id: s.id, name: s.name || "", date: s.date || "", items: s.items || [], notes: s.notes || "" });
const setFromRow = r => ({ id: r.id, name: r.name, date: r.date, items: r.items || [], notes: r.notes || "", updated_at: r.updated_at, updated_by_name: r.updated_by_name });

function persistCloud() { store.set("cloud:songs", cloud.songs); store.set("cloud:sets", cloud.sets); store.set("cloud:queue", cloud.queue); }
function cacheUpsert(t, row) {
  const arr = t === "songs" ? (cloud.songs ||= clone(BASE_SONGS).map(songRow)) : (cloud.sets ||= []);
  const item = t === "songs" ? row : setFromRow(row);
  const i = arr.findIndex(x => x.id === row.id);
  if (i >= 0) arr[i] = { ...arr[i], ...item }; else arr.push(item);
}
function cacheRemove(t, id) {
  if (t === "songs" && cloud.songs) cloud.songs = cloud.songs.filter(x => x.id !== id);
  if (t === "setlists" && cloud.sets) cloud.sets = cloud.sets.filter(x => x.id !== id);
}
function applyOp(op) {
  if (op.op === "upsert") cacheUpsert(op.t, { ...op.row, updated_at: op.row.updated_at || new Date().toISOString() });
  else if (op.op === "delete") cacheRemove(op.t, op.id);

// изменения: последнее по одной и той же песне/сет-листу заменяет предыдущее
function queuePush(op) {
  cloud.queue = cloud.queue.filter(q => !(q.t === op.t && (q.row?.id || q.id) === (op.row?.id || op.id)));
  cloud.queue.push(op);
  applyOp(op);
  persistCloud();
  clearTimeout(queuePush.timer);
  queuePush.timer = setTimeout(flushQueue, 250);

}
const pendingIds = t => new Set(cloud.queue.filter(q => q.t === t).map(q => q.row?.id || q.id));

let needRefetch = false;
async function flushQueue() {
  if (!db || cloud.syncing || !cloud.queue.length) return;
  cloud.syncing = true;
  try {
    while (cloud.queue.length) {
      const op = cloud.queue[0];
      const q = db.from(op.t);
      const res = op.op === "upsert" ? await q.upsert(op.row) : await q.delete().eq("id", op.id);
      if (res.error) {
        const st = res.status | 0;
        if (st >= 400 && st < 500) {
          // база отказала (нет прав или неверные данные) — такое изменение не пройдёт и потом
          console.warn("sync rejected", op, res.error);
          toast("Не сохранилось: " + (st === 401 || st === 403 || res.error.code === "42501" ? "нет прав на изменение" : res.error.message));
          cloud.queue.shift(); persistCloud(); needRefetch = true;
          if (st === 401 || st === 403) refreshMe();
          continue;
        }
        cloud.online = false; break; // нет связи — попробуем позже
      }
      cloud.online = true;
      cloud.queue.shift(); persistCloud();
    }
  } finally { cloud.syncing = false; updateSyncNote(); }
  if (needRefetch) { needRefetch = false; cloudFetch(); }
}

async function cloudFetch() {
  if (!db || !isMember()) return false;
  const [a, b] = await Promise.all([
    db.from("songs").select("*").range(0, 4999),
    db.from("setlists").select("*").range(0, 4999),
  ]);
  if (a.error || b.error) { cloud.online = false; updateSyncNote(); return false; }
  cloud.online = true; cloud.lastFetch = Date.now();
  cloud.songs = a.data; cloud.sets = b.data.map(setFromRow);
  cloud.queue.forEach(applyOp); // неотправленные правки поверх свежих данных
  if (state.admin) {
    const c = await db.from("members").select("user_id", { count: "exact", head: true }).eq("role", "pending");
    if (!c.error) cloud.pending = c.count || 0;
  }
  persistCloud(); loadSongs(); cloud.ready = true;
  refreshView(); return true;
}

function onLive(t, p) {
  const id = (p.new && p.new.id) || (p.old && p.old.id);
  if (!id || pendingIds(t).has(id)) return;
  if (p.eventType === "DELETE") cacheRemove(t, id); else cacheUpsert(t, p.new);
  persistCloud(); loadSongs();
  clearTimeout(onLive.timer); onLive.timer = setTimeout(refreshView, 400);
}

    .on("postgres_changes", { event: "*", schema: "public", table: "setlists" }, p => onLive("setlists", p))
    .subscribe();
  setInterval(flushQueue, 20000);
  addEventListener("online", () => { flushQueue(); cloudFetch(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - cloud.lastFetch > 60000) { cloudFetch(); flushQueue(); if (ME) refreshMe(); } });
}

function cleanJoinUrl() { try { history.replaceState(null, "", location.pathname + location.hash); } catch {} }
// номер телефона: к единому виду (как в базе) и для показа
function normPhone(p) {
  const d = String(p || "").replace(/\D/g, "");
  if (d.startsWith("972")) return d;
  if (d.startsWith("0") && d.length >= 9 && d.length <= 10) return "972" + d.slice(1);
  return d;
}
function fmtPhone(ph) {
  const d = String(ph || "");
  if (d.startsWith("972") && d.length === 12) return "0" + d.slice(3, 5) + "-" + d.slice(5, 8) + "-" + d.slice(8);
  if (d.startsWith("972")) return "0" + d.slice(3);
  return d ? "+" + d : "";
}

// вход по ссылке: номер телефона (из списка — сразу, иначе — заявка)
function joinDialog(code) {
  if (isMember()) { cleanJoinUrl(); return toast("Вы уже в команде на этом устройстве"); }
  modal(`<h3>Вход для команды</h3>
    <div class="muted" style="font-size:14px">Введите свой номер телефона — только цифры.</div>
    <div class="field" style="margin-top:12px"><label>Номер телефона</label>
      <input id="jp" type="tel" inputmode="numeric" autocomplete="tel" placeholder="05X-XXX-XXXX" maxlength="20" dir="ltr"></div>
    <div class="field" id="jnBox" hidden><label>Вашего номера нет в списке команды. Как вас зовут?</label>
      <input id="jn" maxlength="60" autocomplete="name" placeholder="Имя">
      <div class="hint">Руководитель получит заявку и одобрит её.</div></div>
    <div class="actions"><button class="btn" data-x>Не сейчас</button><button class="btn primary" data-ok>Войти</button></div>`, (m, close) => {
    const ph = m.querySelector("#jp"), nmBox = m.querySelector("#jnBox"), nm = m.querySelector("#jn"), okBtn = m.querySelector("[data-ok]");
    setTimeout(() => ph.focus(), 50);
    m.querySelector("[data-x]").onclick = () => { cleanJoinUrl(); close(); };
    const ok = async () => {
      const phone = normPhone(ph.value);
      if (phone.length < 11 || phone.length > 15) return toast("Проверьте номер: например 052-123-4567");
      if (!nmBox.hidden && !nm.value.trim()) return toast("Напишите имя");
      if (!db) return toast("Нет связи с базой — попробуйте позже");
      okBtn.disabled = true; okBtn.textContent = "Проверяю…";
      try {
        let { data: { session } } = await db.auth.getSession();
        if (!session) {
          const r = await db.auth.signInAnonymously();
          if (r.error) return toast(/anonymous/i.test(r.error.message) ? "Вход временно недоступен (Anonymous sign-ins выключены в Supabase)" : "Не получилось войти: " + r.error.message);
        }
        const { data, error } = await db.rpc("join_by_phone", { p_code: code, p_phone: phone, p_name: nmBox.hidden ? null : nm.value.trim() });
        if (error) {
          const msg = error.message || "";
          return toast(/invalid invite/.test(msg) ? "Ссылка устарела — попросите у руководителя новую"
            : /too many/.test(msg) ? "Слишком много попыток. Попробуйте через час."
            : /bad phone/.test(msg) ? "Проверьте номер: например 052-123-4567" : "Ошибка: " + msg);
        }
        if (data && data.need_name) { nmBox.hidden = false; ph.readOnly = true; setTimeout(() => nm.focus(), 50); okBtn.textContent = "Отправить заявку"; return; }
        ME = data; state.admin = ME?.role === "admin"; store.set("cloud:me", ME);
        cleanJoinUrl(); close();
        if (ME?.role === "pending") { toast("Заявка отправлена — ждите одобрения"); show(""); return; }
        toast(`Добро пожаловать, ${ME.name}!`);
        await cloudFetch(); show(currentId);
      } finally { okBtn.disabled = false; if (okBtn.textContent === "Проверяю…") okBtn.textContent = nmBox.hidden ? "Войти" : "Отправить заявку"; }
    };
    okBtn.onclick = ok;
    ph.onkeydown = nm.onkeydown = e => { if (e.key === "Enter") ok(); };
  });
}

function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit" }) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

      box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => confirmDialog("Убрать этот вход? На этом устройстве сайт закроется.", "Убрать", async () => {

    m.querySelector("#peopleAdd").onclick = async () => {
      const rows = [], bad = [];
      m.querySelector("#peopleIn").value.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {

        const name = (mm ? l.replace(mm[1], "") : l).replace(/[,;:\t|–—-]+/g, " ").replace(/\s+/g, " ").trim();

      toast(`Добавлено: ${rows.length}${bad.length ? ` · не разобрал строк: ${bad.length} (остались в поле)` : ""}`);
      loadMembers();
    };
    loadPhones().then(() => { loadPending(); loadMembers(); });
    loadInvites();
    aiUsageHtml().then(h => { const el = m.querySelector("#aiUsage"); if (el) el.innerHTML = h; });
  });
}

// история изменений песни
async function historyDialog(song) {
  if (!needEdit()) return;
  if (!db) return toast("Нет связи с базой");
  const { data, error } = await db.from("song_history").select("id,op,data,changed_at,changed_by_name").eq("song_id", song.id).order("changed_at", { ascending: false }).limit(40);
  if (error) return toast("Не удалось загрузить историю: " + error.message);
  const cur = (cloud.songs || []).find(s => s.id === song.id);
  const preview = d => esc((d.lyrics || "").replace(CHORD_TAG, "").split("\n").filter(Boolean).slice(0, 2).join(" / "));
  const diff = (a, b) => {
    const names = { title: "название", lyrics: "текст", chord_chart: "схема", key: "тональность", play_shift: "наша тональность", capo: "капо", notes: "заметки", tags: "теги", links: "ссылки", status: "этап", translit: "транскрипция", title_alt: "второе название", original: "оригинал", deleted_at: "удаление", review: "проверка" };
    return Object.keys(names).filter(k => JSON.stringify(a?.[k] ?? null) !== JSON.stringify(b?.[k] ?? null)).map(k => names[k]).join(", ");
  };
  modal(`<h3 data-wide>История: ${esc(song.title)}</h3>
    ${cur ? `<div class="hist-row"><div><b>Сейчас</b> <span class="muted">${fmtWhen(cur.updated_at)}${cur.updated_by_name ? " · " + esc(cur.updated_by_name) : ""}</span></div></div>` : ""}
    ${data.length ? data.map((h, i) => {
      const newer = i === 0 ? cur : data[i - 1].data;
      const ch = diff(h.data, newer);
      return `<div class="hist-row"><div><b>${fmtWhen(h.data.updated_at)}</b>${h.data.updated_by_name ? " · " + esc(h.data.updated_by_name) : ""}
        <div class="muted" style="font-size:13px">Потом ${h.changed_by_name ? esc(h.changed_by_name) + " " : ""}${h.op === "delete" ? "удалил(а) песню" : "изменил(а)" + (ch ? ": " + ch : "")} · ${fmtWhen(h.changed_at)}</div>
        <div class="muted" style="font-size:13px" dir="auto">${preview(h.data)}</div></div>
        <button class="btn" data-hv="${i}">Вернуть эту версию</button></div>`;
    }).join("") : `<div class="muted">Изменений пока не было — песня в исходном виде.</div>`}
    <div class="actions"><button class="btn primary" data-x>Закрыть</button></div>`, (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    m.querySelectorAll("[data-hv]").forEach(b => b.onclick = () => confirmDialog("Вернуть эту версию песни? Текущая сохранится в истории.", "Вернуть", () => {
      const d = data[+b.dataset.hv].data;
      queuePush({ t: "songs", op: "upsert", row: songRow({ ...d, deleted_at: null }) });
      loadSongs(); close(); toast("Версия возвращена"); show(song.id);
    }));
  });
}

const YT_RE = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/;

async function agentCall(body) {
  if (!db) throw new Error("Нет связи с базой");
  const { data, error } = await db.functions.invoke("agent", { body });
  if (error) {
    let msg = error.message || "Ошибка";
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch {}
    if (/Failed to send|Failed to fetch|NetworkError/i.test(msg)) msg = "Агент недоступен — нет связи или он ещё не установлен";
    throw new Error(msg);
  }
  return data;
}

function alignTranslit(lyrics, tr) {
  const lines = (lyrics || "").split("\n"), out = lines.map(() => "");
  lyricLineIdx(lyrics || "").forEach((li, k) => { out[li] = (tr[k] || "").trim(); });
  return out;
}
function ytLink(url) { const m = YT_RE.exec(url || ""); return m ? "https://www.youtube.com/watch?v=" + m[1] : ""; }

// результат агента -> черновик для редактора; fields — какие поля брать (null — все)
function agentDraft(out, base, fields) {
  const d = {}, take = f => !fields || fields.includes(f);
  for (const f of ["title", "title_alt", "original", "lang", "key", "lyrics", "chord_chart"]) {
    if (take(f) && typeof out[f] === "string" && out[f].trim()) d[f] = out[f].trim();
  }
  const lyrics = d.lyrics ?? base.lyrics ?? "";
  if (take("translit") && Array.isArray(out.translit) && out.translit.some(Boolean)) d.translit = alignTranslit(lyrics, out.translit);
  else if (d.lyrics && base.translit && base.translit.some(Boolean)) {
    // текст поменялся (добавились аккорды/подписи) — переносим транскрипцию по строкам текста
    const oldIdx = lyricLineIdx(base.lyrics || ""), old = oldIdx.map(i => base.translit[i] || "");
    d.translit = alignTranslit(lyrics, old);
  }
  const yt = ytLink(out.youtube);
  if (take("links") && yt && !(base.links || []).some(l => ytLink(l.url) === yt)) {
    d.links = [...(base.links || []).filter(l => !YT_RE.test(l.url)), { label: "Слушать", url: yt }];
  }
  if (take("tags") && Array.isArray(out.tags)) {
    const ok = out.tags.filter(t => DEFAULT_TAGS.includes(t) || ALL_TAGS.includes(t));
    if (ok.length) d.tags = [...new Set([...(base.tags || []), ...ok])];

}

/* ======================= поиск ======================= */
function search({ ignoreStatus = false } = {}) {
  const nq = norm(state.q), toks = nq ? nq.split(" ") : [];
  const res = [];
  for (const s of SONGS) {
    if (!ignoreStatus && state.status !== "all" && s.status !== state.status) continue;
    if (state.lang !== "all" && s.lang !== state.lang) continue;
    if (state.key && s.keyCode !== state.key) continue;
    if (state.tag && !s.tags.includes(state.tag)) continue;
    const r = scoreSong(s, toks, nq);
    if (r) res.push(r);
  }
  if (toks.length) res.sort((a, b) => b.score - a.score);
  return { res, toks };
}
function scoreSong(s, toks, nq) {
  if (!toks.length) return { s, score: 0, line: -1 };
  if (!toks.every(t => s.nAll.includes(t))) return null;
  let score = 0;
  for (const t of toks) {
    if (s.nTitle.startsWith(t) || s.nTitle.includes(" " + t)) score += 15; else if (s.nTitle.includes(t)) score += 10;
    if (s.nAlt.includes(t)) score += 8;
    if (s.nLines.some(l => l.includes(t))) score += 2;
  }
  if (s.nTitle.includes(nq)) score += 30;
  let line = -1;
  if (!toks.every(t => s.nTitle.includes(t) || s.nAlt.includes(t))) {
    line = s.nLines.findIndex(l => l.includes(nq));
    if (line < 0) line = s.nLines.findIndex(l => toks.every(t => l.includes(t)));
    if (line < 0) line = s.nLines.findIndex(l => l.includes(toks[0]));
    if (line >= 0 && s.nLines[line].includes(nq)) score += 10;
  }
  return { s, score, line };
}
function highlight(orig, toks) {
  if (!toks.length) return esc(orig);
  let n = ""; const map = [];
  [...orig].forEach((c, i) => { for (const ch of normChar(c)) { n += ch; map.push(i); } });
  const chars = [...orig], marks = new Array(chars.length).fill(false);
  for (const t of toks) { let from = 0, idx; while (t && (idx = n.indexOf(t, from)) >= 0) { for (let k = idx; k < idx + t.length; k++) marks[map[k]] = true; from = idx + t.length; } }
  let html = "", open = false;
  chars.forEach((c, i) => {
    const m = marks[i] || (open && /[֑-ׇ̀-ͯ]/.test(c));
    if (m && !open) { html += "<mark>"; open = true; }
    if (!m && open) { html += "</mark>"; open = false; }
    html += esc(c);
  });
  return html + (open ? "</mark>" : "");
}

/* ======================= отрисовка текста ======================= */
function renderLine(line, shift, ki, extraClass = "") {
  line = line.replace(/\s+$/, "");
  if (!line.trim()) return '<div class="ln blank"></div>';
  const dir = lineDir(line);
  if (SECTION_RE.test(line.trim())) return `<div class="ln sec" dir="${dir}">${esc(line.trim().replace(/:$/, ""))}</div>`;
  if (!line.includes("[")) return `<div class="ln ${extraClass}" dir="${dir}">${esc(line)}</div>`;
  const parts = line.split(/(\[[^\]]+\])/);
  if (!line.replace(CHORD_TAG, "").trim()) {
    const chords = parts.filter(p => p.startsWith("[")).map(p => `<span>${esc(trChord(p.slice(1, -1), shift, ki))}</span>`).join("");
    return `<div class="ln only-ch"><span class="chrow">${chords}</span></div>`;
  }
  let html = esc(parts[0]);
  for (let i = 1; i < parts.length; i += 2) {
    const ch = trChord(parts[i].slice(1, -1), shift, ki);
    const after = parts[i + 1] || "";
    const m = /^(\S*)([\s\S]*)$/.exec(after);
    const needPad = after.length * 0.5 < ch.length * 0.6 + 0.4;
    const minW = (ch.length * 0.6 + 0.45).toFixed(2);
    html += `<span class="seg${needPad ? " pad" : ""}"${needPad ? ` style="min-width:${minW}em"` : ""}><span class="ch">${esc(ch)}</span>${m[1] ? esc(m[1]) : "&nbsp;"}</span>${esc(m[2])}`;
  }
  return `<div class="ln has-ch ${extraClass}" dir="${dir}">${html}</div>`;
}
const hasTranslit = song => song.translit.some(Boolean);
function renderLyrics(song, shift, mode) {
  const ki = keyInfo(song, shift);
  const useTr = hasTranslit(song) ? mode : "he";
  return song.lyrics.split("\n").map((line, i) => {
    const tr = song.translit[i];
    if (tr && useTr === "tr") return renderLine(translitWithChords(line, tr), shift, ki);
    let html = renderLine(line, shift, ki);
    if (tr && useTr === "both") html += `<div class="ln tr" dir="ltr" style="text-align:${lineDir(line) === "rtl" ? "right" : "left"}">${esc(tr)}</div>`;
    return html;
  }).join("");
}
// то же, что renderLyrics, но строки сгруппированы в блоки (куплет/припев) — чтобы блоки не рвались между колонками и страницами
function renderLyricsBlocks(song, shift, mode) {
  const ki = keyInfo(song, shift);
  const useTr = hasTranslit(song) ? mode : "he";
  const blocks = []; let cur = [];
  const close = () => { if (cur.length) blocks.push(`<div class="blk">${cur.join("")}</div>`); cur = []; };
  song.lyrics.split("\n").forEach((line, i) => {
    const plain = line.replace(CHORD_TAG, "").trim();
    if (!line.trim()) { close(); return; }
    if (SECTION_RE.test(plain)) close();
    const tr = song.translit[i];
    if (tr && useTr === "tr") cur.push(renderLine(translitWithChords(line, tr), shift, ki));
    else {
      cur.push(renderLine(line, shift, ki));
      if (tr && useTr === "both") cur.push(`<div class="ln tr" dir="ltr" style="text-align:${lineDir(line) === "rtl" ? "right" : "left"}">${esc(tr)}</div>`);
    }
  });
  close();
  return blocks.join("");
}

/* ---------- строение песни: части и повторы ---------- */
// делим текст на части (по подписям «Куплет:», «Припев:», пустым строкам) и находим повторы:
// часть с тем же текстом, что раньше, или пустая подпись («Припев:» без строк) — это повтор
function songSections(song) {
  const lines = song.lyrics.split("\n"), secs = [];
  let cur = null;
  const push = () => { if (cur && (cur.label || cur.idx.length)) secs.push(cur); cur = null; };
  lines.forEach((line, i) => {
    const plain = line.replace(CHORD_TAG, "").trim();
    if (!line.trim()) { push(); return; }
    if (SECTION_RE.test(plain)) { push(); cur = { label: plain.replace(/:$/, "").trim(), li: i, idx: [] }; return; }
    if (!cur) cur = { label: "", li: -1, idx: [] };
    cur.idx.push(i);
  });
  push();
  const type = l => l.replace(/\d+/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  secs.forEach((sec, k) => {
    sec.type = type(sec.label);
    sec.sig = sec.idx.map(i => lines[i].replace(/\s+/g, " ").trim()).join("\n");
    sec.rep = -1;
    if (!sec.idx.length) {
      for (let j = k - 1; j >= 0; j--) if (secs[j].type === sec.type && secs[j].idx.length) { sec.rep = secs[j].rep >= 0 ? secs[j].rep : j; break; }
    } else {
      for (let j = 0; j < k; j++) if (secs[j].rep < 0 && secs[j].idx.length && secs[j].sig === sec.sig) { sec.rep = j; break; }
    }
  });
  return { lines, secs, hasRepeats: secs.some(x => x.rep >= 0) };
}
// полоска «строение песни»: Куплет 1 → Пред-припев → Припев ×2 → …
function structureHtml(sec) {
  const items = [];
  sec.secs.forEach((x, k) => {
    const r = x.rep >= 0 ? x.rep : k;
    const label = x.label || sec.secs[r].label || "…";
    const last = items[items.length - 1];
    if (last && last.r === r) last.n++; else items.push({ r, label, rep: x.rep >= 0, n: 1 });
  });
  return `<div class="structure" dir="ltr">${items.map((it, i) => `${i ? '<span class="arr">→</span>' : ""}<button class="st-chip${it.rep ? " rep" : ""}" data-sec="${it.r}" dir="auto">${esc(it.label)}${it.n > 1 ? ` ×${it.n}` : ""}</button>`).join("")}</div>`;
}
// одна строка текста с учётом режима транскрипции
function lyricLineHtml(song, line, i, shift, ki, useTr) {
  const tr = song.translit[i];
  if (tr && useTr === "tr") return renderLine(translitWithChords(line, tr), shift, ki);
  let html = renderLine(line, shift, ki);
  if (tr && useTr === "both") html += `<div class="ln tr" dir="ltr" style="text-align:${lineDir(line) === "rtl" ? "right" : "left"}">${esc(tr)}</div>`;
  return html;
}
// текст, где каждая часть показана один раз, а сверху — строение песни
function renderLyricsFolded(song, shift, mode, sec = songSections(song)) {
  const ki = keyInfo(song, shift);

  const body = sec.secs.map((x, k) => {

    return `<div class="blk" id="sec-${k}">${head}${x.idx.map(i => lyricLineHtml(song, sec.lines[i], i, shift, ki, useTr)).join("")}</div>`;
  }).join("");

// выбор: свернуть повторы (если они есть и включено) или показать как есть
function lyricsHtml(song, shift, mode, blocks = false) {

/* ======================= экспорт ======================= */
function plainChordsAbove(line, shift, ki) {
  const parts = line.split(/(\[[^\]]+\])/);
  let text = parts[0], chords = "";
  for (let i = 1; i < parts.length; i += 2) {
    const ch = trChord(parts[i].slice(1, -1), shift, ki);
    let pos = text.length; if (chords.length > pos) pos = chords.length + 1;
    chords = chords.padEnd(pos) + ch; text += parts[i + 1] || "";

  return text.trim() ? chords.replace(/\s+$/, "") + "\n" + text : chords;

function songToText(song, { chords = true, shift = 0, mode = "he" } = {}) {

  const useTr = hasTranslit(song) ? mode : "he";
  song.lyrics.split("\n").forEach((line, i) => {
    const tr = song.translit[i];
    const l = tr && useTr === "tr" ? translitWithChords(line, tr) : line;
    if (!chords) out.push(l.replace(CHORD_TAG, "").replace(/\s{2,}/g, " ").trim());
    else if (!l.includes("[")) out.push(l);
    else if (lineDir(l) === "rtl") out.push(l.replace(/\[([^\]]+)\]/g, (_, c) => "[" + trChord(c, shift, ki) + "]"));
    else out.push(plainChordsAbove(l, shift, ki));
    if (tr && useTr === "both") out.push("  " + tr);
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
}

function songToChordPro(song, shift = 0, mode = "he") {
  const ki = keyInfo(song, shift);
  const out = [`{title: ${song.title}}`];
  if (song.title_alt) out.push(`{subtitle: ${song.title_alt}}`);
  if (song.key) out.push(`{key: ${ki.name}}`);
  if (curCapo(song)) out.push(`{capo: ${curCapo(song)}}`);
  if (song.tags.length) out.push(`{meta: tags ${song.tags.join(", ")}}`);
  if (song.chord_chart) song.chord_chart.split("\n").forEach(l => out.push(`{comment: ${l}}`));
  out.push("");
  const useTr = hasTranslit(song) ? mode : "he";
  song.lyrics.split("\n").forEach((line, i) => {
    if (SECTION_RE.test(line.trim())) { out.push(`{comment: ${line.trim().replace(/:$/, "")}}`); return; }
    const tr = song.translit[i];
    const l = tr && useTr === "tr" ? translitWithChords(line, tr) : line;
    out.push(l.replace(/\[([^\]]+)\]/g, (_, c) => "[" + trChord(c, shift, ki) + "]"));
    if (tr && useTr === "both") out.push(tr);
  });
  return out.join("\n") + "\n";
}

function download(name, content, type = "text/plain;charset=utf-8") {

    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch { toast("Не удалось скачать файл"); }
}

// «на 1 лист»: подбираем размер шрифта и 1 или 2 колонки так, чтобы песня влезла на страницу A4
const PAGE_H = 990; // ≈ 267 мм полезной высоты A4 при 96 dpi
function fitToPage(html) {
  let m = document.getElementById("measure");
  if (!m) { m = document.createElement("div"); m.id = "measure"; document.body.appendChild(m); }
  m.innerHTML = html;
  const sec = m.firstElementChild, lyr = sec.querySelector(".lyrics");
  const tries = [];
  for (let pt = 13; pt >= 10.5; pt -= 0.5) tries.push([1, pt]);
  for (let pt = 13; pt >= 8; pt -= 0.5) tries.push([2, pt]);
  let pick = [2, 8];
  for (const [cols, pt] of tries) {
    sec.classList.toggle("cols2", cols === 2);
    lyr.style.fontSize = pt + "pt";
    if (sec.scrollHeight <= PAGE_H) { pick = [cols, pt]; break; }
  }
  m.innerHTML = "";
  return html.replace('class="p-song compact', `class="p-song compact${pick[0] === 2 ? " cols2" : ""}`)
    .replace('<div class="lyrics">', `<div class="lyrics" style="font-size:${pick[1]}pt">`);
}
function printItems(items, { toc = false, title = "Песни прославления", compact = false, group = false } = {}) {
  const area = document.getElementById("printArea");
  // сборник: сначала русские песни, потом на иврите — у каждой группы своё оглавление на отдельном листе
  if (group) items = [...items.filter(x => x.song.lang !== "he"), ...items.filter(x => x.song.lang === "he")];
  const blocks = items.map(({ song, shift }, i) => { const h = printSongHtml(song, shift, compact, toc ? i + 1 : 0); return compact ? fitToPage(h) : h; }).join("");
  const row = ({ song, shift }, i) => `<div class="toc-row"><span class="n" dir="ltr">${i + 1}</span><span class="t" dir="auto">${esc(song.title)}</span>${song.key && state.showChords ? `<span class="k" dir="ltr">${esc(keyInfo(song, shift).name)}</span>` : ""}</div>`;
  let tocHtml = "";
  if (toc) {
    const rows = items.map((x, i) => ({ x, i }));
    const ru = rows.filter(r => r.x.song.lang !== "he"), he = rows.filter(r => r.x.song.lang === "he");
    if (group && ru.length && he.length) {
      tocHtml = `<section class="p-toc"><h1>${esc(title)}</h1><h3>Песни на русском</h3><div class="toc-list">${ru.map(r => row(r.x, r.i)).join("")}</div></section>
        <section class="p-toc" dir="rtl"><h1 dir="rtl">שירים בעברית</h1><div class="toc-list">${he.map(r => row(r.x, r.i)).join("")}</div></section>`;
    } else {
      const rtl = he.length && !ru.length;
      tocHtml = `<section class="p-toc" dir="${rtl ? "rtl" : "ltr"}"><h1 dir="auto">${esc(title)}</h1><div class="toc-list">${rows.map(r => row(r.x, r.i)).join("")}</div></section>`;
    }
  }
  area.innerHTML = tocHtml + blocks;
  document.body.classList.add("printing");
  const done = () => { document.body.classList.remove("printing"); area.innerHTML = ""; removeEventListener("afterprint", done); };
  addEventListener("afterprint", done);
  if (IN_FRAME) toast("В предпросмотре Claude печать заблокирована — на своём сайте или в открытом файле работает");
  setTimeout(() => { try { window.print(); } catch {} setTimeout(() => { if (IN_FRAME) done(); }, 500); }, 50);
}

function importBackup() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    try {
      const data = JSON.parse((await inp.files[0].text()).replace(/^﻿/, ""));
      const songs = Array.isArray(data) ? data : data.songs || [];
      if (CLOUD) {
        if (!needEdit()) return;
        const cur = new Map((cloud.songs || []).map(s => [s.id, JSON.stringify(songRow(s))]));
        let n = 0;
        for (const s of songs) {
          if (!s || !s.id || !s.title) continue;
          const row = songRow({ ...s, status: s.status || "songbook", deleted_at: null });
          if (cur.get(s.id) !== JSON.stringify(row)) { queuePush({ t: "songs", op: "upsert", row }); n++; }
        }
        let m = 0;
        if (Array.isArray(data.setlists)) {
          const sets = getSets(); const ids = new Set(sets.map(s => s.id));
          data.setlists.forEach(s => { if (s && s.id && !ids.has(s.id)) { sets.push(s); m++; } });
          if (m) saveSets(sets);
        }
        loadSongs(); renderList(); toast(`Обновлено песен: ${n}${m ? `, сет-листов добавлено: ${m}` : ""}`);
        return;
      }
      const edits = store.get("edits", {});
      let n = 0;
      for (const s of songs) { if (s && s.id && s.title) { edits[s.id] = pick({ ...s, status: s.status || "songbook" }); n++; } }
      store.set("edits", edits);
      if (Array.isArray(data.setlists)) {
        const sets = getSets(); const ids = new Set(sets.map(s => s.id));
        data.setlists.forEach(s => { if (!ids.has(s.id)) sets.push(s); });
        saveSets(sets);
      }
      loadSongs(); renderList(); toast(`Загружено песен: ${n}`);
    } catch { toast("Не получилось прочитать файл"); }
  };
  inp.click();
}

  const same = SONGS.filter(s => s !== song && s.keyCode === code);

// насколько удобна форма аккорда на гитаре (3 — открытый, 1 — баррэ)
const EASY = {
  "C": 3, "D": 3, "E": 3, "G": 3, "A": 3, "F": 1.8, "Am": 3, "Em": 3, "Dm": 3, "Bm": 1.4, "Hm": 1.4,
  "C7": 3, "D7": 3, "E7": 3, "G7": 3, "A7": 3, "B7": 2.6, "H7": 2.6, "Am7": 3, "Em7": 3, "Dm7": 2.8,
  "Cmaj7": 3, "Fmaj7": 2.8, "Gmaj7": 2.5, "Amaj7": 2.6, "Dmaj7": 2.7, "Emaj7": 2.5,
  "Dsus4": 3, "Dsus2": 3, "Asus4": 3, "Asus2": 3, "Esus4": 3, "Gsus4": 2.6, "Csus2": 2.4, "Cadd9": 3, "Gadd9": 2.6, "Em9": 2.6,
};
function chordEase(ch) {
  const m = /^([A-H][#b]?)([^/]*)(?:\/([A-H][#b]?))?$/.exec(ch); if (!m) return 2;
  let [, root, q, bass] = m; root = root === "H" ? "B" : root;
  if (/^[A-H]b$/.test(root) || /^[A-H]#$/.test(root)) { const i = IDX[root]; root = SHARP[i].length === 1 ? SHARP[i] : root; }
  const qn = q.replace(/^min/, "m").replace(/^M(?=aj)/, "M");
  let e = EASY[root + qn] ?? EASY[root + (qn.startsWith("m") && !qn.startsWith("maj") ? "m" : "")] ?? (/[#b]/.test(root) ? 0.8 : 1.1);
  if (EASY[root + qn] === undefined && qn && !/^m$/.test(qn)) e = Math.min(e, (EASY[root + (qn.startsWith("m") && !qn.startsWith("maj") ? "m" : "")] ?? 1) - 0.2);
  if (bass) { const b = bass === "H" ? "B" : bass; const okBass = { "G/B": 3, "C/E": 3, "D/F#": 2.4, "C/G": 3, "Am/G": 2.8, "D/A": 3, "Em/D": 2.8, "C/B": 2.6, "G/F#": 2.3, "A/C#": 2.3, "Em/G": 3, "F/C": 2.6 }[root + (qn.startsWith("m") && !qn.startsWith("maj") ? "m" : "") + "/" + b]; e = okBass ?? e - 0.5; }
  return Math.max(0.3, e);
}
function songChords(song) {
  const all = [...song.lyrics.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
  (song.chord_chart || "").split(/\s+/).forEach(t => { if (CHORD_RE.test(t)) all.push(t); });
  return all;
}
function capoOptions(song, shift) {
  const chords = songChords(song); if (!chords.length) return [];
  const opts = [];
  for (let capo = 0; capo <= 7; capo++) {
    const ds = shift - capo, ki = keyInfo(song, ds);
    // формы считаем «гитарными» названиями: без H, с диезами или бемолями как удобнее
    const shapes = chords.map(c => trChord(c, ds, ki));

  updYt(); $("f-title").addEventListener("input", updYt); $("f-alt").addEventListener("input", updYt);

    e.preventDefault();

    if (!title) { $("f-title").focus(); return toast("Нужно название"); }
    const lyrics = lyr.value.replace(/\r/g, "").replace(/\s+$/, "");
    const lines = lyrics.split("\n");
    const trRaw = $("f-tr").value.replace(/\r/g, "");

    }
    const out = {
      ...s, title, title_alt: $("f-alt").value.trim(), original: $("f-orig").value.trim(), key: $("f-key").value.trim(), lang: $("f-lang").value,
      lyrics, chord_chart: $("f-chart").value.replace(/\r/g, "").trim(),
      translit: translit.some(Boolean) ? translit : [],
      tags: [...$("f-tags").querySelectorAll("[data-t].on")].map(b => b.dataset.t),
      links: [...links.querySelectorAll(".link-row")].map(r => { const [a, b] = r.querySelectorAll("input"); return { label: a.value.trim(), url: b.value.trim() }; }).filter(l => /^https?:\/\//.test(l.url)),
    };
    if (!out.key) out.key = guessKey(lyrics + "\n" + out.chord_chart);
    const po = parseKey(out.key), pp = parseKey($("f-play").value.trim().replace(/^H/, "B"));
    out.play_shift = po && pp ? normShift(pp.i - po.i) : 0;
    if ($("f-play").value.trim() && !pp) toast("Не понял «нашу тональность» — оставил оригинал");
    delete state.shift[out.id];

    toast(ok ? "Сохранено" : "Не удалось сохранить в этом окне");
    state.status = out.status; store.set("status", out.status);
    go(out.id);
  };
  if (isNew) $("f-title").focus();
}

async function sha(t) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("songs:" + t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) | 0; return String(h); }
}
function adminDialog() {

  if (state.admin) {
    return confirmDialog("Выйти из режима админа на этом устройстве?", "Выйти", () => { state.admin = false; store.set("admin", false); go(""); });
  }
  const hasPin = !!store.get("adminPin", "");
  modal(`<h3>Режим админа</h3>
    <div class="muted" style="font-size:14px">${hasPin ? "Введите PIN админа." : "Придумайте PIN для режима админа на этом устройстве."} Пока нет общей базы, это только «замок» от случайных глаз; настоящий вход по паролю появится вместе с Supabase.</div>
    <div class="field" style="margin-top:12px"><input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN"></div>
    <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn primary" data-ok>${hasPin ? "Войти" : "Сохранить PIN и войти"}</button></div>`, (m, close) => {

}

/* ======================= импорт песен из PDF =======================
   Тот же разбор, что мы делали для ваших файлов: текст и аккорды берутся из PDF
   (не из картинки), аккорды над строками переносятся в формат [Am] — по их положению
   над словами. Работает прямо в браузере, файлы никуда не отправляются. */
const PDFJS_BASE = window.PDFJS_BASE || "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfjsReady = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); });
}
function loadPdfJs() {
  if (!pdfjsReady) pdfjsReady = (async () => {
    // worker подключаем обычным скриптом — pdf.js тогда работает без отдельного потока (так можно и в окне просмотра)
    await loadScript(PDFJS_BASE + "pdf.min.js");
    await loadScript(PDFJS_BASE + "pdf.worker.min.js");

function cropDialog(img) {
  return new Promise(resolve => {
    let done = false;
    const closeX = modal(`<h3 data-wide>Распознать со скриншота</h3>
      <div class="muted" style="font-size:14px">Выделите мышкой или пальцем только текст песни — без кнопок и схем аккордов. Если вся картинка — это песня, просто нажмите «Распознать».</div>
      <div class="crop-wrap" id="cw"><img id="ci" alt=""><div class="crop-sel" id="cs"></div></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <span class="muted" style="font-size:14px">Язык текста:</span>
        <div class="seg-ctl" id="cl"><button data-l="rus" class="on">Русский</button><button data-l="heb">עברית</button></div>
        <span class="spacer"></span><button class="btn" id="cAll">Вся картинка</button>
      </div>
      <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn primary" data-ok>Распознать</button></div>`, (m, close) => {
      const ci = m.querySelector("#ci"), cs = m.querySelector("#cs"), cw = m.querySelector("#cw");
      ci.src = img.src;
      let lang = "rus", sel = null, start = null;
      const W = img.naturalWidth, H = img.naturalHeight;
      const showSel = () => {
        if (!sel) { cs.style.display = "none"; return; }
        const k = ci.clientWidth / W;
        Object.assign(cs.style, { display: "block", left: sel.x * k + "px", top: sel.y * k + "px", width: sel.w * k + "px", height: sel.h * k + "px" });
      };
      const pt = e => { const r = ci.getBoundingClientRect(), k = W / r.width; return { x: Math.max(0, Math.min(W, (e.clientX - r.left) * k)), y: Math.max(0, Math.min(H, (e.clientY - r.top) * k)) }; };
      cw.addEventListener("pointerdown", e => { e.preventDefault(); cw.setPointerCapture(e.pointerId); start = pt(e); sel = null; showSel(); });
      cw.addEventListener("pointermove", e => { if (!start) return; const p = pt(e); sel = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) }; showSel(); });
      cw.addEventListener("pointerup", () => { start = null; if (sel && (sel.w < 20 || sel.h < 20)) { sel = null; showSel(); } });
      m.querySelector("#cAll").onclick = () => { sel = null; showSel(); };
      m.querySelector("#cl").onclick = e => { const b = e.target.closest("[data-l]"); if (!b) return; lang = b.dataset.l; m.querySelectorAll("#cl button").forEach(x => x.classList.toggle("on", x === b)); };
      m.querySelector("[data-x]").onclick = () => { done = true; close(); resolve(null); };
      m.querySelector("[data-ok]").onclick = () => { done = true; close(); resolve({ crop: sel, lang }); };
    });
  });
}

/* ======================= проектор (слова для зала) ======================= */
function buildSlides(song, withTr) {
  const lines = song.lyrics.split("\n");
  const blocks = []; let cur = { label: "", lines: [] };
  const push = () => {
    if (cur.lines.length) blocks.push(cur);
    else if (cur.label) {
      // «Припев:» без текста — повтор уже бывшего припева
      const prev = [...blocks].reverse().find(b => norm(b.label) === norm(cur.label) && b.lines.length);
      if (prev) blocks.push({ label: cur.label, lines: prev.lines });
    }
    cur = { label: "", lines: [] };
  };
  lines.forEach((raw, i) => {
    const plain = raw.replace(CHORD_TAG, "").replace(/\s+/g, " ").trim();
    if (!plain) { if (raw.includes("[")) return; push(); return; }
    if (SECTION_RE.test(plain)) { push(); cur.label = plain.replace(/:$/, ""); return; }
    cur.lines.push({ text: plain, tr: withTr ? song.translit[i] || "" : "" });
  });
  push();
  const slides = [];
  for (const b of blocks) {
    const max = withTr && b.lines.some(l => l.tr) ? 4 : 6;
    if (b.lines.length <= max) { slides.push({ ...b, song }); continue; }
    const parts = Math.ceil(b.lines.length / max), size = Math.ceil(b.lines.length / parts);
    for (let k = 0; k < b.lines.length; k += size) slides.push({ label: b.label, lines: b.lines.slice(k, k + size), song });
  }
  return slides;
}
let proj = null;
function openProjector(list, startSong = 0) {
  closeProjector();
  const hasHe = list.some(x => hasTranslit(x.song));
  const el = document.createElement("div"); el.className = "proj"; el.id = "proj";
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  proj = { list, el, i: 0, blank: false, uiTimer: null };
  const build = () => {
    proj.slides = list.flatMap(x => buildSlides(x.song, state.projTr && hasTranslit(x.song)));
    if (!proj.slides.length) proj.slides = [{ label: "", lines: [{ text: list[0]?.song.title || "", tr: "" }], song: list[0]?.song }];
  };
  build();
  if (startSong) proj.i = Math.max(0, proj.slides.findIndex(s => s.song === list[startSong].song));
  const fit = () => {
    const box = el.querySelector(".slide"), txt = el.querySelector(".txt"); if (!box || !txt) return;
    let lo = 16, hi = 160;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1; txt.style.fontSize = mid + "px";
      if (txt.scrollHeight <= box.clientHeight * 0.92 && txt.scrollWidth <= box.clientWidth * 0.96) lo = mid; else hi = mid;
    }
    txt.style.fontSize = lo + "px";
  };
  const draw = () => {
    const s = proj.slides[proj.i];
    const firstOfSong = proj.i === 0 || proj.slides[proj.i - 1].song !== s.song;
    el.classList.toggle("blank", proj.blank);
    el.innerHTML = `
      <div class="lbl">${firstOfSong && list.length > 1 ? esc(s.song.title) + (s.label ? " · " : "") : ""}${esc(s.label || "")}</div>
      <div class="slide"><div class="txt">${s.lines.map(l => `<span class="l" dir="${lineDir(l.text)}">${esc(l.text)}</span>${l.tr ? `<span class="t2" dir="ltr">${esc(l.tr)}</span>` : ""}`).join("")}</div></div>
      <div class="count">${proj.i + 1} / ${proj.slides.length}</div>
      <div class="proj-ui">
        <button data-p="close" title="Выйти (Esc)">✕</button>
        <button data-p="prev">◀</button><span class="pos">${proj.i + 1}/${proj.slides.length}</span><button data-p="next">▶</button>
        <button data-p="blank" class="${proj.blank ? "on" : ""}" title="Чёрный экран (B)">Чёрный</button>
        ${hasHe ? `<button data-p="tr" class="${state.projTr ? "on" : ""}" title="Транскрипция под ивритом">Транскр.</button>` : ""}
        <button data-p="fs" title="Во весь экран">⛶</button>
      </div>`;
    requestAnimationFrame(fit);
  };
  const showUi = () => { el.classList.add("show-ui"); clearTimeout(proj.uiTimer); proj.uiTimer = setTimeout(() => el.classList.remove("show-ui"), 2500); };
  proj.move = d => { proj.blank = false; proj.i = Math.min(proj.slides.length - 1, Math.max(0, proj.i + d)); draw(); };
  proj.key = e => {
    e.stopImmediatePropagation();
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); proj.move(1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); proj.move(-1); }
    else if (e.key === "b" || e.key === "B" || e.key === "и" || e.key === ".") { proj.blank = !proj.blank; draw(); }
    else if (e.key === "Home") { proj.i = 0; draw(); }
    else if (e.key === "End") { proj.i = proj.slides.length - 1; draw(); }
    else if (e.key === "Escape") closeProjector();
  };
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-p]");
    if (b) {
      const p = b.dataset.p;
      if (p === "close") return closeProjector();
      if (p === "prev") proj.move(-1);
      if (p === "next") proj.move(1);
      if (p === "blank") { proj.blank = !proj.blank; draw(); }
      if (p === "tr") { state.projTr = !state.projTr; store.set("projTr", state.projTr); const song = proj.slides[proj.i].song; build(); proj.i = Math.max(0, proj.slides.findIndex(s => s.song === song)); draw(); }
      if (p === "fs") { try { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen())?.catch?.(() => toast("Полный экран недоступен в этом окне")); } catch { toast("Полный экран недоступен в этом окне"); } }
      showUi(); return;
    }
    // клик по слайду: справа — вперёд, слева — назад
    proj.move(e.clientX > innerWidth / 3 ? 1 : -1); showUi();
  });
  el.addEventListener("mousemove", showUi);
  addEventListener("keydown", proj.key, true);
  proj.resize = () => requestAnimationFrame(fit);
  addEventListener("resize", proj.resize);
  draw(); showUi();
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {}
  keepAwake(true);
}
function closeProjector() {
  if (!proj) return;
  removeEventListener("keydown", proj.key, true); removeEventListener("resize", proj.resize);
  proj.el.remove(); proj = null; document.body.style.overflow = "";
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
  keepAwake(false);
}

  if ((id === "new" || (id && id.startsWith("edit-"))) && !canEdit()) { needEdit(); id = id === "new" ? "" : id.slice(5); currentId = id; }
  if (id === "new") { current = "edit"; renderEditor(null); }
  else if (id && id.startsWith("edit-")) { const s = songById(id.slice(5)); current = "edit"; s ? renderEditor(s) : renderList(); }
  else if (id === "sets") { current = "sets"; renderSets(); }
  else if (id === "todo") { if (state.admin) { current = "todo"; renderTodo(); } else { current = "list"; currentId = ""; renderList(); adminDialog(); return; } }
  else if (id === "admin") { current = "list"; currentId = ""; renderList(); adminDialog(); return; }
  else if (id && id.startsWith("set-")) { const st = getSet(id); if (st) { current = "set"; renderSet(st); } else { current = "sets"; renderSets(); } }
  else if (id && songById(id)) {
    if (state.ctx) { const st = ctxSet(); if (!st || st.items[state.ctx.idx]?.songId !== id) state.ctx = null; }
    current = "song"; renderSong(songById(id));
  }
  else { current = "list"; currentId = ""; renderList(); return; }
  scrollTo(0, 0);
}
function go(id, opts) {
  show(id, opts);
  try {
    if (location.hash.slice(1) !== (id || "")) {
      if (id) history.pushState(null, "", "#" + id); else history.pushState(null, "", location.pathname + location.search);
    }
  } catch {}
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]");
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button > 0) return;
  e.preventDefault();
  const id = a.dataset.go;
  // «назад» из песни, открытой в сет-листе, — в тот же сет-лист
  go(id, { keepCtx: false });
});
const fromUrl = () => { const id = location.hash.slice(1); if (id !== currentId) show(id, { keepCtx: !!state.ctx }); };
addEventListener("hashchange", fromUrl);
addEventListener("popstate", fromUrl);
addEventListener("scroll", () => { const h = document.querySelector("header.top"); if (h) h.classList.toggle("scrolled", scrollY > 4); }, { passive: true });
addEventListener("keydown", e => {
  if (proj || document.querySelector(".modal-bg")) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if (e.key === "/" && current === "list" && !typing) { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "/" && current !== "list" && current !== "edit" && !typing) { e.preventDefault(); quickSearch(); }
  if (e.key === "Escape" && !typing) { if (document.getElementById("stage")) closeStage(true); else if (current === "song") go(state.ctx ? state.ctx.setId : ""); }
  if (current === "song" && state.ctx && !typing) {
    if (e.key === "ArrowRight") document.getElementById("nextSong")?.click();
    if (e.key === "ArrowLeft") document.getElementById("prevSong")?.click();
  }
});

loadSongs();
show(location.hash.slice(1));
if (CLOUD) cloudInit();
</script>
