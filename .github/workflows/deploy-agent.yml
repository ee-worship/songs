# Устанавливает AI-агента (Supabase Edge Function) при каждом изменении его кода.
# Нужны секреты репозитория: SUPABASE_ACCESS_TOKEN и ANTHROPIC_API_KEY.
name: deploy-agent
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-agent.yml"]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: dphcnmwdqxhysjhgvtse
    steps:
      - uses: actions/checkout@v4
      - name: Проверить секреты
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Добавьте секрет SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)"; exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Ключ Claude → секреты Supabase
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then supabase secrets set --project-ref "$PROJECT" --yes ANTHROPIC_API_KEY="$KEY"; else echo "::warning::Нет секрета ANTHROPIC_API_KEY"; fi
      - name: Установить агента
        run: supabase functions deploy agent --project-ref "$PROJECT" --no-verify-jwt --yes
